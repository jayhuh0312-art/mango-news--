
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffc928">
  <title>MANGO NEWS | 경제를 쉽게 읽다</title>

  <style>
    :root {
      --mango: #ffc928;
      --mango-light: #fff3bf;
      --ink: #242424;
      --paper: #fffdf5;
      --muted: #777;
      --border: #eee5c9;
      --green: #397d45;
      --red: #d94a38;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Malgun Gothic", sans-serif;
      color: var(--ink);
      background: var(--paper);
      line-height: 1.65;
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    button:focus-visible,
    a:focus-visible {
      outline: 3px solid #765800;
      outline-offset: 3px;
    }

    .header {
      background: var(--mango);
      padding: 18px 20px;
      border-bottom: 3px solid #f1b800;
    }

    .header-inner {
      max-width: 1120px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .logo {
      border: 0;
      background: transparent;
      padding: 0;
      color: #242424;
      text-align: left;
    }

    .logo h1 {
      margin: 0;
      font-size: 29px;
      font-weight: 900;
      letter-spacing: -1px;
    }

    .logo p {
      margin: 0;
      font-size: 13px;
    }

    .refresh-button {
      background: #242424;
      color: white;
      border: 0;
      border-radius: 12px;
      padding: 10px 16px;
      font-weight: bold;
    }

    .refresh-button:hover {
      background: #444;
    }

    main {
      max-width: 1120px;
      margin: 0 auto;
      padding: 24px 20px 60px;
    }

    .welcome {
      padding: 22px;
      border-radius: 18px;
      background: #fff4c9;
      margin-bottom: 25px;
    }

    .welcome h2 {
      margin: 0 0 7px;
      font-size: 25px;
    }

    .welcome p {
      margin: 0;
      color: #5f5129;
    }

    .section-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 24px 0 14px;
      flex-wrap: wrap;
    }

    .section-heading h2 {
      margin: 0;
      font-size: 23px;
    }

    #newsStatus {
      color: var(--muted);
      font-size: 13px;
    }

    .categories {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 22px;
    }

    .category-button {
      background: white;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 8px 14px;
      color: #514a38;
    }

    .category-button.active {
      background: var(--mango);
      border-color: var(--mango);
      color: #242424;
      font-weight: bold;
    }

    .news-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 20px;
    }

    .news-card {
      min-width: 0;
      overflow: hidden;
      background: white;
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 3px 12px #00000008;
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .news-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px #00000012;
    }

    .card-open {
      display: block;
      width: 100%;
      padding: 0;
      border: 0;
      background: transparent;
      color: inherit;
      text-align: left;
    }

    .card-image {
      display: block;
      width: 100%;
      height: 190px;
      object-fit: cover;
      background: #fff3bf;
    }

    .card-image-placeholder {
      width: 100%;
      height: 190px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #fff1ad, #ffe08a);
      color: #795900;
      font-size: 42px;
    }

    .card-image-placeholder span {
      margin-left: 8px;
      font-size: 14px;
    }

    .card-content {
      padding: 16px;
    }

    .card-source {
      color: #876700;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 7px;
    }

    .card-title {
      margin: 0 0 10px;
      font-size: 18px;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    .card-description {
      margin: 0;
      color: #666;
      font-size: 14px;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-date {
      margin-top: 13px;
      color: #888;
      font-size: 12px;
    }

    .message {
      padding: 30px 18px;
      border-radius: 14px;
      background: white;
      border: 1px solid var(--border);
      text-align: center;
      color: #666;
    }

    .hidden {
      display: none !important;
    }

    /* 기사 상세 화면 */
    .back-button {
      background: white;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px 14px;
      margin-bottom: 20px;
    }

    .back-button:hover {
      background: var(--mango-light);
    }

    .detail {
      max-width: 850px;
      margin: 0 auto;
    }

    .detail-panel {
      background: white;
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 24px;
      margin-bottom: 20px;
    }

    .detail-source {
      color: #876700;
      font-weight: bold;
      font-size: 13px;
    }

    .detail-title {
      font-size: 30px;
      line-height: 1.4;
      margin: 10px 0;
      overflow-wrap: anywhere;
    }

    .detail-date {
      color: #888;
      font-size: 13px;
      margin-bottom: 20px;
    }

    .detail-original-description {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      color: #555;
    }

    .detail-image {
      display: block;
      width: 100%;
      max-height: 460px;
      object-fit: contain;
      background: #fff8dd;
      border-radius: 12px;
      margin: 18px 0;
    }

    .easy-title {
      margin: 0 0 12px;
      font-size: 23px;
    }

    .easy-article {
      white-space: pre-wrap;
      font-size: 17px;
      line-height: 1.95;
      overflow-wrap: anywhere;
    }

    .terms-list {
      padding-left: 22px;
    }

    .terms-list li {
      margin-bottom: 10px;
    }

    .loading {
      color: #876700;
      padding: 14px 0;
    }

    .error-message {
      color: #b32c21;
      background: #fff0ed;
      border-radius: 10px;
      padding: 12px;
    }

    .retry-button,
    .original-button {
      display: inline-block;
      margin-top: 10px;
      background: var(--mango);
      color: #242424;
      border: 0;
      border-radius: 10px;
      padding: 10px 14px;
      font-weight: bold;
      text-decoration: none;
    }

    footer {
      border-top: 1px solid var(--border);
      padding: 24px 20px;
      text-align: center;
      color: #777;
      font-size: 13px;
    }

    @media (max-width: 850px) {
      .news-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 560px) {
      .header {
        padding: 15px;
      }

      main {
        padding: 18px 14px 40px;
      }

      .news-grid {
        grid-template-columns: 1fr;
      }

      .card-image,
      .card-image-placeholder {
        height: 205px;
      }

      .detail-panel {
        padding: 17px;
      }

      .detail-title {
        font-size: 24px;
      }

      .welcome h2 {
        font-size: 22px;
      }
    }
  </style>
</head>

<body>
  <header class="header">
    <div class="header-inner">
      <button class="logo" id="homeLogo" aria-label="망고 뉴스 홈으로">
        <h1>🥭 MANGO NEWS</h1>
        <p>경제와 세상을 쉽게 읽다</p>
      </button>

      <button class="refresh-button" id="refreshButton">
        ↻ 최신 뉴스 불러오기
      </button>
    </div>
  </header>

  <main>
    <section id="homeView">
      <div class="welcome">
        <h2>오늘의 뉴스를 쉽게 읽어 봐요! 🥭</h2>
        <p>
          어려운 경제와 세상 이야기를 초등학교 6학년도 이해할 수 있도록
          쉽게 설명해요.
        </p>
      </div>

      <div class="section-heading">
        <h2>📰 최신 뉴스</h2>
        <span id="newsStatus" aria-live="polite">뉴스를 불러오는 중...</span>
      </div>

      <nav class="categories" id="categories" aria-label="뉴스 카테고리">
        <button class="category-button active" data-category="all">전체 뉴스</button>
        <button class="category-button" data-category="economy">경제</button>
        <button class="category-button" data-category="stock">주식·투자</button>
        <button class="category-button" data-category="finance">금융·은행</button>
        <button class="category-button" data-category="prices">물가·생활경제</button>
        <button class="category-button" data-category="business">기업·산업</button>
        <button class="category-button" data-category="world">국제경제·무역</button>
        <button class="category-button" data-category="policy">부동산·일자리·정책</button>
      </nav>

      <section id="newsGrid" class="news-grid" aria-label="뉴스 목록"></section>

      <div id="newsMessage" class="message hidden"></div>
    </section>

    <section id="detailView" class="hidden">
      <div class="detail">
        <button class="back-button" id="backButton">← 홈으로 돌아가기</button>

        <article class="detail-panel">
          <div class="detail-source" id="detailSource"></div>
          <h1 class="detail-title" id="detailTitle"></h1>
          <div class="detail-date" id="detailDate"></div>

          <img id="detailImage" class="detail-image hidden" alt="뉴스 관련 그림">

          <div class="section-heading">
            <h2 class="easy-title">🍋 AI로 쉽게 설명하기</h2>
          </div>

          <div id="summaryStatus" class="loading" aria-live="polite">
            쉬운 설명을 준비하고 있어요...
          </div>

          <div id="summaryContent" class="hidden">
            <div class="easy-article" id="easyArticle"></div>

            <div id="termsSection" class="hidden">
              <h3>📚 어려운 단어 알아보기</h3>
              <ul class="terms-list" id="termsList"></ul>
            </div>
          </div>

          <button class="retry-button hidden" id="retrySummaryButton">
            ↻ 다시 설명하기
          </button>

          <p>
            <a id="originalLink" class="original-button" href="#" target="_blank" rel="noopener noreferrer">
              원문 뉴스 보기 ↗
            </a>
          </p>
        </article>
      </div>
    </section>
  </main>

  <footer>
    <p>🥭 MANGO NEWS — 어려운 뉴스를 쉽게 읽는 공간</p>
    <p>AI 설명은 이해를 돕기 위한 것이며, 정확한 내용은 원문도 확인해 주세요.</p>
  </footer>

  <script>
    const state = {
      articles: [],
      category: "all",
      requestId: 0,
      detailRequestId: 0,
      currentArticle: null
    };

    const $ = (id) => document.getElementById(id);

    const homeView = $("homeView");
    const detailView = $("detailView");
    const newsGrid = $("newsGrid");
    const newsStatus = $("newsStatus");
    const newsMessage = $("newsMessage");

    function normalise(article) {
      return {
        title: article.title || "제목 없는 뉴스",
        description: article.description || article.summary || "",
        url: article.url || article.link || "",
        domain: article.domain || article.source || "뉴스",
        date: article.date || article.pubDate || "",
        image: article.image || article.socialimage || article.imageUrl || "",
        category: article.category || ""
      };
    }

    function safeDate(dateString) {
      if (!dateString) return "";

      const date = new Date(dateString);
      if (Number.isNaN(date.getTime())) return "";

      return date.toLocaleString("ko-KR", {
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    function inferCategory(article) {
      const text = (article.title + " " + article.description).toLowerCase();

      if (/주식|증시|코스피|코스닥|상장|주가|투자|배당/.test(text)) {
        return "stock";
      }

      if (/은행|금리|대출|예금|금융|환율|원화/.test(text)) {
        return "finance";
      }

      if (/물가|가격|소비자물가|생활비|장바구니|인플레이션/.test(text)) {
        return "prices";
      }

      if (/기업|산업|반도체|자동차|삼성|현대|공장|실적|매출/.test(text)) {
        return "business";
      }

      if (/무역|수출|수입|미국|중국|일본|유럽|국제|세계 경제/.test(text)) {
        return "world";
      }

      if (/부동산|아파트|집값|일자리|취업|정부 정책|국회|세금/.test(text)) {
        return "policy";
      }

      if (/경제|시장|성장|경기|소비|고용|기업/.test(text)) {
        return "economy";
      }

      return article.category || "all";
    }

    function createPlaceholder() {
      const placeholder = document.createElement("div");
      placeholder.className = "card-image-placeholder";

      const mango = document.createElement("span");
      mango.textContent = "🥭";

      const label = document.createElement("span");
      label.textContent = "오늘의 뉴스";

      placeholder.append(mango, label);
      return placeholder;
    }

    function renderNews() {
      newsGrid.replaceChildren();
      newsMessage.classList.add("hidden");

      const filtered = state.articles.filter((article) => {
        if (state.category === "all") return true;
        return inferCategory(article) === state.category;
      });

      if (!filtered.length) {
        newsMessage.textContent = state.articles.length
          ? "이 카테고리에 해당하는 뉴스가 아직 없어요. 다른 카테고리도 확인해 보세요."
          : "표시할 뉴스가 없어요. 잠시 후 다시 불러와 주세요.";
        newsMessage.classList.remove("hidden");
        return;
      }

      for (const article of filtered) {
        const card = document.createElement("article");
        card.className = "news-card";

        const openButton = document.createElement("button");
        openButton.className = "card-open";
        openButton.type = "button";
        openButton.setAttribute("aria-label", article.title);

        // 실제 사진이 없거나 불러오지 못하면 망고 안내 그림을 보여 줍니다.
        if (article.image && /^https?:\/\//i.test(article.image)) {
          const image = document.createElement("img");
          image.className = "card-image";
          image.alt = "";
          image.loading = "lazy";
          image.src = article.image;

          image.onerror = () => {
            if (image.isConnected) {
              image.replaceWith(createPlaceholder());
            }
          };

          openButton.appendChild(image);
        } else {
          openButton.appendChild(createPlaceholder());
        }

        const content = document.createElement("div");
        content.className = "card-content";

        const source = document.createElement("div");
        source.className = "card-source";
        source.textContent = article.domain;

        const title = document.createElement("h3");
        title.className = "card-title";
        title.textContent = article.title;

        const description = document.createElement("p");
        description.className = "card-description";
        description.textContent = article.description || "기사를 열어 쉬운 설명을 확인해 보세요.";

        const date = document.createElement("div");
        date.className = "card-date";
        date.textContent = safeDate(article.date);

        content.append(source, title, description, date);
        openButton.appendChild(content);
        openButton.addEventListener("click", () => openArticle(article));
        card.appendChild(openButton);
        newsGrid.appendChild(card);
      }
    }

    async function loadNews() {
      const thisRequest = ++state.requestId;

      newsStatus.textContent = "뉴스를 불러오는 중...";
      newsMessage.classList.add("hidden");
      $("refreshButton").disabled = true;

      try {
        const response = await fetch("/api/news?mode=live&t=" + Date.now(), {
          cache: "no-store"
        });

        if (!response.ok) {
          throw new Error("뉴스 서버 응답 오류 (" + response.status + ")");
        }

        const data = await response.json();

        if (thisRequest !== state.requestId) return;

        const rawArticles = Array.isArray(data)
          ? data
          : (data.articles || data.news || []);

        state.articles = rawArticles.map(normalise);
        renderNews();

        newsStatus.textContent = state.articles.length
          ? "뉴스 " + state.articles.length + "개"
          : "새 뉴스가 없어요";
      } catch (error) {
        if (thisRequest !== state.requestId) return;

        console.error("뉴스 불러오기 오류:", error);
        newsStatus.textContent = "뉴스를 불러오지 못했어요";
        newsMessage.textContent =
          "뉴스 서버에 연결하지 못했어요. 인터넷 연결이나 Cloudflare 배포 상태를 확인한 뒤 다시 시도해 주세요.";
        newsMessage.classList.remove("hidden");
      } finally {
        if (thisRequest === state.requestId) {
          $("refreshButton").disabled = false;
        }
      }
    }

    function showHome() {
      state.detailRequestId++;
      state.currentArticle = null;
      detailView.classList.add("hidden");
      homeView.classList.remove("hidden");
      window.scrollTo({ top: 0, behavior: "instant" });
    }

    function showDetail() {
      homeView.classList.add("hidden");
      detailView.classList.remove("hidden");
      window.scrollTo({ top: 0, behavior: "instant" });
    }

    function setSummaryStatus(message, isError = false) {
      const status = $("summaryStatus");
      status.textContent = message;
      status.className = isError ? "error-message" : "loading";
    }

    function showDetailImage(article, requestId) {
      const image = $("detailImage");
      image.classList.add("hidden");
      image.removeAttribute("src");
      image.onerror = null;

      if (article.image && /^https?:\/\//i.test(article.image)) {
        image.src = article.image;
        image.alt = "기사에서 제공한 뉴스 이미지";
        image.classList.remove("hidden");

        image.onerror = () => {
          if (requestId === state.detailRequestId) {
            image.classList.add("hidden");
            generateIllustration(article, requestId);
          }
        };
      } else {
        generateIllustration(article, requestId);
      }
    }

    async function generateIllustration(article, requestId) {
      const image = $("detailImage");

      try {
        const response = await fetch("/api/generate-image", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            title: article.title,
            description: article.description
          })
        });

        if (!response.ok) {
          throw new Error("AI 그림 생성 서버 오류");
        }

        const data = await response.json();

        if (requestId !== state.detailRequestId) return;

        if (data.image) {
          image.src = data.image.startsWith("data:")
            ? data.image
            : "data:image/png;base64," + data.image;
          image.alt = "AI가 만든 뉴스 관련 그림";
          image.onerror = () => image.classList.add("hidden");
          image.classList.remove("hidden");
        }
      } catch (error) {
        console.error("AI 그림 생성 오류:", error);
      }
    }

    async function openArticle(article) {
      state.currentArticle = article;
      const requestId = ++state.detailRequestId;

      showDetail();

      $("detailSource").textContent = article.domain;
      $("detailTitle").textContent = article.title;
      $("detailDate").textContent = safeDate(article.date);
      $("originalLink").href = article.url || "#";
      $("easyArticle").textContent = "";
      $("termsList").replaceChildren();
      $("summaryContent").classList.add("hidden");
      $("termsSection").classList.add("hidden");
      $("retrySummaryButton").classList.add("hidden");
      setSummaryStatus("쉬운 설명을 준비하고 있어요...");

      showDetailImage(article, requestId);
      await loadSummary(article, requestId);
    }

    async function loadSummary(article, requestId) {
      setSummaryStatus("AI가 뉴스를 쉬운 말로 설명하고 있어요...");
      $("retrySummaryButton").classList.add("hidden");
      $("summaryContent").classList.add("hidden");

      try {
        const response = await fetch("/api/summarize", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            title: article.title,
            description: article.description,
            url: article.url,
            domain: article.domain
          })
        });

        if (!response.ok) {
          throw new Error("AI 설명 서버 오류 (" + response.status + ")");
        }

        const data = await response.json();

        if (requestId !== state.detailRequestId) return;

        const articleText = data.article || data.summary || data.explanation;

        if (!articleText) {
          throw new Error("AI가 설명 내용을 반환하지 않았어요.");
        }

        $("easyArticle").textContent = articleText;

        const terms = Array.isArray(data.terms) ? data.terms : [];
        $("termsList").replaceChildren();

        for (const term of terms) {
          const li = document.createElement("li");
          const name = document.createElement("strong");
          name.textContent = (term.term || "용어") + ": ";
          const definition = document.createTextNode(
            term.definition || term.meaning || ""
          );

          li.append(name, definition);
          $("termsList").appendChild(li);
        }

        $("termsSection").classList.toggle("hidden", terms.length === 0);
        $("summaryContent").classList.remove("hidden");
        $("summaryStatus").className = "loading";
        $("summaryStatus").textContent = "쉬운 설명을 완성했어요!";
      } catch (error) {
        if (requestId !== state.detailRequestId) return;

        console.error("AI 요약 오류:", error);
        setSummaryStatus(
          "쉬운 설명을 만들지 못했어요. 인터넷 연결을 확인하고 다시 시도해 주세요.",
          true
        );
        $("retrySummaryButton").classList.remove("hidden");
      }
    }

    function selectCategory(category) {
      state.category = category;

      document.querySelectorAll(".category-button").forEach((button) => {
        const active = button.dataset.category === category;
        button.classList.toggle("active", active);
        button.setAttribute("aria-pressed", String(active));
      });

      renderNews();
    }

    $("refreshButton").addEventListener("click", loadNews);
    $("backButton").addEventListener("click", showHome);
    $("homeLogo").addEventListener("click", showHome);

    $("retrySummaryButton").addEventListener("click", () => {
      if (state.currentArticle) {
        loadSummary(state.currentArticle, state.detailRequestId);
      }
    });

    $("categories").addEventListener("click", (event) => {
      const button = event.target.closest(".category-button");
      if (button) selectCategory(button.dataset.category);
    });

    loadNews();
  </script>
</body>
</html>
