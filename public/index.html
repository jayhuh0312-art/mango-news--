
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffc928">
  <title>MANGO NEWS | 경제와 뉴스를 쉽게 읽다</title>

  <style>
    :root {
      --mango: #ffc928;
      --mango-light: #fff4c7;
      --ink: #242424;
      --muted: #777;
      --paper: #fffdf6;
      --white: #fff;
      --line: #eee7d6;
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      font-family: Arial, "Malgun Gothic", "맑은 고딕", sans-serif;
      line-height: 1.6;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    a {
      color: inherit;
    }

    .top-strip {
      height: 7px;
      background: var(--mango);
    }

    .site-header {
      background: var(--white);
      border-bottom: 1px solid var(--line);
    }

    .header-inner {
      max-width: 1100px;
      margin: auto;
      padding: 22px 22px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      border: 0;
      padding: 0;
      background: transparent;
      color: var(--ink);
      text-align: left;
    }

    .brand-name {
      display: block;
      font-size: 30px;
      line-height: 1.15;
      font-weight: 900;
      letter-spacing: -1.3px;
    }

    .brand-name span {
      color: #e9a900;
    }

    .brand-subtitle {
      display: block;
      margin-top: 5px;
      font-size: 12px;
      color: var(--muted);
    }

    .header-label {
      padding: 7px 13px;
      border-radius: 999px;
      background: var(--mango-light);
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    main {
      max-width: 1100px;
      min-height: 70vh;
      margin: auto;
      padding: 26px 22px 60px;
    }

    .hero {
      position: relative;
      overflow: hidden;
      padding: 30px;
      border-radius: 24px;
      background: var(--mango);
      margin-bottom: 28px;
    }

    .hero::after {
      content: "🥭";
      position: absolute;
      right: 25px;
      bottom: -12px;
      font-size: 95px;
      opacity: .22;
      transform: rotate(-15deg);
      pointer-events: none;
    }

    .hero-label {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,.65);
      font-size: 12px;
      font-weight: 800;
    }

    .hero h1 {
      max-width: 650px;
      margin: 13px 0 8px;
      font-size: clamp(25px, 4vw, 37px);
      line-height: 1.25;
      letter-spacing: -1.2px;
    }

    .hero p {
      max-width: 620px;
      margin: 0;
      color: #514319;
      font-size: 14px;
    }

    .section-heading {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 12px;
      margin: 28px 0 15px;
    }

    .section-heading h2 {
      margin: 0;
      font-size: 22px;
      letter-spacing: -.6px;
    }

    .section-heading p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .refresh-button {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 9px 13px;
      background: var(--white);
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }

    .refresh-button:hover {
      background: var(--mango-light);
    }

    .category-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 0 0 22px;
    }

    .category-button {
      padding: 8px 15px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--white);
      color: #555;
      font-size: 13px;
      font-weight: 700;
      transition: .15s ease;
    }

    .category-button:hover {
      border-color: var(--mango);
    }

    .category-button.active {
      border-color: var(--mango);
      background: var(--mango);
      color: var(--ink);
    }

    .status {
      padding: 25px 18px;
      margin: 15px 0;
      border: 1px dashed #e6d8b1;
      border-radius: var(--radius);
      background: #fffaf0;
      color: #655a3b;
      text-align: center;
      font-size: 14px;
    }

    .status.error {
      color: #a32b2b;
      background: #fff5f3;
      border-color: #f0c9c3;
    }

    .news-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 15px;
    }

    .news-card {
      min-width: 0;
      padding: 19px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--white);
      transition: transform .15s ease, box-shadow .15s ease;
    }

    .news-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 7px 22px rgba(100, 77, 12, .07);
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }

    .category-tag {
      display: inline-block;
      padding: 4px 9px;
      border-radius: 7px;
      background: var(--mango-light);
      font-size: 11px;
      font-weight: 800;
      white-space: nowrap;
    }

    .source-name {
      overflow: hidden;
      color: var(--muted);
      font-size: 11px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .news-title {
      display: block;
      width: 100%;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--ink);
      font-size: 17px;
      font-weight: 800;
      line-height: 1.5;
      text-align: left;
      overflow-wrap: anywhere;
    }

    .news-title:hover {
      color: #a77700;
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    .news-description {
      margin: 10px 0 0;
      color: #666;
      font-size: 13px;
      line-height: 1.65;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 3;
      overflow: hidden;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-top: 15px;
      padding-top: 12px;
      border-top: 1px solid #f3eee2;
    }

    .news-date {
      color: #888;
      font-size: 11px;
    }

    .read-more {
      color: #8b6800;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .detail-view {
      max-width: 820px;
      margin: 0 auto;
    }

    .back-button {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 9px 14px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: var(--white);
      font-size: 13px;
      font-weight: 800;
    }

    .back-button:hover {
      background: var(--mango-light);
    }

    .detail-paper {
      margin-top: 17px;
      padding: clamp(20px, 5vw, 38px);
      border: 1px solid var(--line);
      border-radius: 22px;
      background: var(--white);
    }

    .detail-meta {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 9px;
      margin-bottom: 14px;
      color: var(--muted);
      font-size: 12px;
    }

    .detail-title {
      margin: 0 0 18px;
      font-size: clamp(24px, 4vw, 34px);
      line-height: 1.4;
      letter-spacing: -.8px;
      overflow-wrap: anywhere;
    }

    .detail-divider {
      height: 1px;
      margin: 22px 0;
      background: var(--line);
    }

    .easy-heading {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 15px;
      font-size: 20px;
    }

    .easy-heading .emoji {
      display: grid;
      width: 38px;
      height: 38px;
      place-items: center;
      border-radius: 12px;
      background: var(--mango-light);
      flex-shrink: 0;
    }

    .easy-article {
      color: #393939;
      font-size: 16px;
      line-height: 2;
      overflow-wrap: anywhere;
    }

    .easy-article p {
      margin: 0 0 13px;
    }

    .terms-section {
      margin-top: 28px;
      padding: 18px;
      border-radius: 15px;
      background: #fffaf0;
    }

    .terms-section h3 {
      margin: 0 0 12px;
      font-size: 16px;
    }

    .term-item {
      padding: 11px 0;
      border-top: 1px solid #eee4cb;
      font-size: 13px;
    }

    .term-item strong {
      display: block;
      margin-bottom: 3px;
      color: #8b6800;
    }

    .original-link {
      display: inline-flex;
      margin-top: 22px;
      padding: 11px 15px;
      border-radius: 11px;
      background: var(--mango);
      color: var(--ink);
      text-decoration: none;
      font-size: 13px;
      font-weight: 800;
    }

    .original-link:hover {
      background: #f0b900;
    }

    .footer {
      padding: 25px 20px;
      border-top: 1px solid var(--line);
      background: #fffaf0;
      color: #827965;
      text-align: center;
      font-size: 12px;
    }

    [hidden] {
      display: none !important;
    }

    @media (max-width: 650px) {
      .header-inner {
        padding: 18px 16px;
      }

      .brand-name {
        font-size: 26px;
      }

      .header-label {
        padding: 6px 9px;
        font-size: 10px;
      }

      main {
        padding: 19px 14px 40px;
      }

      .hero {
        padding: 23px 20px;
        border-radius: 19px;
      }

      .hero::after {
        right: 10px;
        font-size: 70px;
      }

      .news-grid {
        grid-template-columns: 1fr;
      }

      .news-card {
        padding: 16px;
      }

      .section-heading h2 {
        font-size: 20px;
      }

      .category-list {
        gap: 7px;
      }

      .category-button {
        padding: 7px 12px;
      }
    }
  </style>
</head>

<body>
  <div class="top-strip"></div>

  <header class="site-header">
    <div class="header-inner">
      <button class="brand" id="homeBrand" type="button" aria-label="망고 뉴스 홈">
        <span class="brand-name">🥭 MANGO <span>NEWS</span></span>
        <span class="brand-subtitle">어려운 뉴스를 쉽고 재미있게</span>
      </button>
      <span class="header-label">어린이를 위한 쉬운 뉴스</span>
    </div>
  </header>

  <main>
    <section id="homeView">
      <section class="hero">
        <span class="hero-label">TODAY'S NEWS</span>
        <h1>세상의 소식을<br>망고처럼 달콤하고 쉽게!</h1>
        <p>
          어려운 뉴스도 괜찮아요. 제목을 누르면 무슨 일이 일어났는지
          쉬운 말로 읽을 수 있어요.
        </p>
      </section>

      <div class="section-heading">
        <div>
          <h2>오늘의 뉴스</h2>
          <p id="updateText">최신 뉴스를 불러오고 있어요.</p>
        </div>
        <button class="refresh-button" id="refreshButton" type="button">
          ↻ 새로고침
        </button>
      </div>

      <nav class="category-list" id="categoryList" aria-label="뉴스 카테고리">
        <button class="category-button active" data-category="전체" type="button">전체</button>
        <button class="category-button" data-category="경제" type="button">경제</button>
        <button class="category-button" data-category="주식" type="button">주식</button>
        <button class="category-button" data-category="정치" type="button">정치</button>
        <button class="category-button" data-category="사회" type="button">사회</button>
        <button class="category-button" data-category="국제" type="button">국제</button>
        <button class="category-button" data-category="기술" type="button">기술</button>
        <button class="category-button" data-category="일반" type="button">일반</button>
      </nav>

      <div id="newsStatus" class="status" role="status">
        뉴스를 불러오고 있어요. 잠시만 기다려 주세요.
      </div>

      <section id="newsGrid" class="news-grid" aria-label="뉴스 목록"></section>
    </section>

    <section id="detailView" class="detail-view" hidden>
      <button id="backButton" class="back-button" type="button">
        ← 홈으로 돌아가기
      </button>

      <article class="detail-paper">
        <div class="detail-meta">
          <span id="detailCategory" class="category-tag">일반</span>
          <span id="detailSource"></span>
          <span id="detailDate"></span>
        </div>

        <h1 id="detailTitle" class="detail-title"></h1>

        <div class="detail-divider"></div>

        <section aria-labelledby="easyTitle">
          <h2 class="easy-heading" id="easyTitle">
            <span class="emoji">💡</span>
            <span>초등학생도 이해하는 쉬운 설명</span>
          </h2>

          <div id="summaryStatus" class="status" role="status">
            기사를 쉽게 설명하고 있어요.
          </div>

          <div id="easyArticle" class="easy-article"></div>

          <section id="termsSection" class="terms-section" hidden>
            <h3>📖 어려운 단어 알아보기</h3>
            <div id="termsList"></div>
          </section>
        </section>

        <a id="originalLink" class="original-link"
           href="#" target="_blank" rel="noopener noreferrer">
          원문 기사 보기 ↗
        </a>
      </article>

      <div style="margin-top: 18px;">
        <button id="backButtonBottom" class="back-button" type="button">
          ← 뉴스 목록으로
        </button>
      </div>
    </section>
  </main>

  <footer class="footer">
    MANGO NEWS 🥭 · 뉴스를 쉽고 바르게 이해해요.
  </footer>

  <script>
    const API_NEWS = "/api/news";
    const API_SUMMARIZE = "/api/summarize";

    const elements = {
      homeView: document.getElementById("homeView"),
      detailView: document.getElementById("detailView"),
      newsGrid: document.getElementById("newsGrid"),
      newsStatus: document.getElementById("newsStatus"),
      updateText: document.getElementById("updateText"),
      categoryList: document.getElementById("categoryList"),
      refreshButton: document.getElementById("refreshButton"),
      homeBrand: document.getElementById("homeBrand"),
      backButton: document.getElementById("backButton"),
      backButtonBottom: document.getElementById("backButtonBottom"),
      detailCategory: document.getElementById("detailCategory"),
      detailSource: document.getElementById("detailSource"),
      detailDate: document.getElementById("detailDate"),
      detailTitle: document.getElementById("detailTitle"),
      summaryStatus: document.getElementById("summaryStatus"),
      easyArticle: document.getElementById("easyArticle"),
      termsSection: document.getElementById("termsSection"),
      termsList: document.getElementById("termsList"),
      originalLink: document.getElementById("originalLink")
    };

    let allArticles = [];
    let selectedCategory = "전체";
    let currentArticle = null;
    let summaryRequestId = 0;

    function cleanText(value) {
      return String(value || "")
        .replace(/[\u200B-\u200D\uFEFF]/g, "")
        .trim();
    }

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[char]);
    }

    function getCategory(article) {
      const supplied = cleanText(article.category || article.section);

      const aliases = {
        "경제": "경제",
        "금융": "경제",
        "주식": "주식",
        "증시": "주식",
        "정치": "정치",
        "사회": "사회",
        "국제": "국제",
        "세계": "국제",
        "기술": "기술",
        "IT": "기술",
        "과학": "기술",
        "일반": "일반"
      };

      if (aliases[supplied]) return aliases[supplied];

      const title = cleanText(
        (article.originalTitle || article.title || "") + " " +
        (article.description || "")
      ).toLowerCase();

      if (/주식|증시|코스피|코스닥|상장|주가|주주|배당|stock|shares|nasdaq/.test(title)) {
        return "주식";
      }

      if (/경제|금리|물가|환율|은행|금융|수출|수입|무역|부동산|경기|고용|실업|economy|inflation|interest rate/.test(title)) {
        return "경제";
      }

      if (/대통령|국회|국회의원|정당|선거|정부|장관|외교부|정치|법안|president|election|parliament/.test(title)) {
        return "정치";
      }

      if (/인공지능|ai\b|반도체|로봇|스마트폰|컴퓨터|인터넷|우주|과학|기술|앱|소프트웨어|technology|artificial intelligence|chip/.test(title)) {
        return "기술";
      }

      if (/미국|중국|일본|한국|북한|유럽|러시아|우크라이나|중동|전쟁|국제|세계|해외|global|international|world|united states/.test(title)) {
        return "국제";
      }

      if (/사건|사고|경찰|법원|학교|학생|교육|병원|건강|환경|화재|교통|범죄|시민|지역|사회|community|school|court/.test(title)) {
        return "사회";
      }

      return "일반";
    }

    function normalise(article) {
      const originalTitle = cleanText(
        article.originalTitle || article.title || "제목 없음"
      );

      return {
        ...article,
        title: originalTitle,
        originalTitle,
        description: cleanText(article.description || ""),
        url: cleanText(article.url || article.link || ""),
        domain: cleanText(article.domain || article.source || "뉴스"),
        date: cleanText(article.date || article.pubDate || ""),
        category: getCategory(article)
      };
    }

    function formatDate(value) {
      if (!value) return "날짜 정보 없음";

      const date = new Date(value);

      if (Number.isNaN(date.getTime())) return value;

      return new Intl.DateTimeFormat("ko-KR", {
        year: "numeric",
        month: "long",
        day: "numeric",
        hour: "2-digit",
        minute: "2-digit"
      }).format(date);
    }

    function setStatus(message, isError = false) {
      elements.newsStatus.hidden = false;
      elements.newsStatus.textContent = message;
      elements.newsStatus.classList.toggle("error", isError);
    }

    function setSummaryStatus(message, isError = false) {
      elements.summaryStatus.hidden = false;
      elements.summaryStatus.textContent = message;
      elements.summaryStatus.classList.toggle("error", isError);
    }

    function makeCard(article, index) {
      const card = document.createElement("article");
      card.className = "news-card";

      const top = document.createElement("div");
      top.className = "card-top";

      const tag = document.createElement("span");
      tag.className = "category-tag";
      tag.textContent = article.category;

      const source = document.createElement("span");
      source.className = "source-name";
      source.textContent = article.domain;

      top.append(tag, source);

      const title = document.createElement("button");
      title.className = "news-title";
      title.type = "button";
      title.textContent = article.title;
      title.addEventListener("click", () => showArticle(article));

      const description = document.createElement("p");
      description.className = "news-description";
      description.textContent =
        article.description || "이 기사의 쉬운 설명을 확인해 보세요.";

      const footer = document.createElement("div");
      footer.className = "card-footer";

      const date = document.createElement("span");
      date.className = "news-date";
      date.textContent = formatDate(article.date);

      const readMore = document.createElement("span");
      readMore.className = "read-more";
      readMore.textContent = "쉽게 읽기 →";

      footer.append(date, readMore);
      card.append(top, title, description, footer);

      return card;
    }

    function renderNews() {
      elements.newsGrid.replaceChildren();

      const filtered = selectedCategory === "전체"
        ? allArticles
        : allArticles.filter(
            article => article.category === selectedCategory
          );

      if (!filtered.length) {
        setStatus(
          allArticles.length
            ? "이 카테고리에는 아직 기사가 없어요. 다른 카테고리를 눌러 보세요."
            : "표시할 뉴스가 없어요. 잠시 후 새로고침해 주세요."
        );
        return;
      }

      elements.newsStatus.hidden = true;

      const fragment = document.createDocumentFragment();

      filtered.forEach((article, index) => {
        fragment.appendChild(makeCard(article, index));
      });

      elements.newsGrid.appendChild(fragment);
    }

    async function loadNews() {
      elements.refreshButton.disabled = true;
      elements.refreshButton.textContent = "불러오는 중…";
      setStatus("최신 뉴스를 불러오고 있어요. 잠시만 기다려 주세요.");

      try {
        const response = await fetch(API_NEWS, {
          method: "GET",
          cache: "no-store",
          headers: { "Accept": "application/json" }
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "뉴스 서버에 연결하지 못했어요.");
        }

        const articles = Array.isArray(data.articles)
          ? data.articles
          : Array.isArray(data)
            ? data
            : [];

        allArticles = articles
          .map(normalise)
          .filter(article => article.title && article.url);

        if (!allArticles.length) {
          setStatus(
            data.error || "가져온 뉴스가 없어요. 잠시 후 다시 시도해 주세요.",
            true
          );
          elements.updateText.textContent = "뉴스를 불러오지 못했어요.";
          return;
        }

        const updatedAt = data.updatedAt
          ? formatDate(data.updatedAt)
          : "방금 확인";

        elements.updateText.textContent =
          allArticles.length + "개의 뉴스 · 업데이트 " + updatedAt;

        renderNews();
      } catch (error) {
        console.error("뉴스 불러오기 오류:", error);
        setStatus(
          "뉴스를 불러오지 못했어요. 인터넷 연결과 Cloudflare 배포 상태를 확인해 주세요. (" +
          (error.message || "연결 오류") + ")",
          true
        );
        elements.updateText.textContent = "뉴스 연결에 문제가 있어요.";
      } finally {
        elements.refreshButton.disabled = false;
        elements.refreshButton.textContent = "↻ 새로고침";
      }
    }

    function showHome(updateHistory = true) {
      summaryRequestId++;
      elements.detailView.hidden = true;
      elements.homeView.hidden = false;
      currentArticle = null;

      if (updateHistory && location.hash !== "#home") {
        history.pushState({ view: "home" }, "", "#home");
      }

      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    async function showArticle(article, updateHistory = true) {
      currentArticle = article;

      elements.homeView.hidden = true;
      elements.detailView.hidden = false;

      elements.detailCategory.textContent = article.category;
      elements.detailSource.textContent = article.domain;
      elements.detailDate.textContent = formatDate(article.date);
      elements.detailTitle.textContent = article.title;

      elements.originalLink.href = article.url || "#";
      elements.easyArticle.replaceChildren();
      elements.termsList.replaceChildren();
      elements.termsSection.hidden = true;

      setSummaryStatus("기사를 쉬운 말로 설명하고 있어요. 잠시만 기다려 주세요.");

      if (updateHistory) {
        history.pushState(
          { view: "article", url: article.url },
          "",
          "#article"
        );
      }

      window.scrollTo({ top: 0, behavior: "smooth" });

      const requestId = ++summaryRequestId;

      try {
        const response = await fetch(API_SUMMARIZE, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            title: article.originalTitle || article.title,
            originalTitle: article.originalTitle || article.title,
            description: article.description || ""
          })
        });

        const data = await response.json();

        if (requestId !== summaryRequestId) return;

        if (!response.ok) {
          throw new Error(data.error || "AI 설명을 만들지 못했어요.");
        }

        const explanation = cleanText(
          data.article || data.summary || data.explanation || ""
        );

        if (!explanation) {
          throw new Error("AI가 설명을 반환하지 않았어요.");
        }

        elements.summaryStatus.hidden = true;
        elements.easyArticle.replaceChildren();

        explanation.split(/\n+/).forEach(line => {
          const text = line.trim();
          if (!text) return;

          const paragraph = document.createElement("p");
          paragraph.textContent = text;
          elements.easyArticle.appendChild(paragraph);
        });

        if (!elements.easyArticle.childElementCount) {
          const paragraph = document.createElement("p");
          paragraph.textContent = explanation;
          elements.easyArticle.appendChild(paragraph);
        }

        const terms = Array.isArray(data.terms) ? data.terms : [];

        if (terms.length) {
          elements.termsList.replaceChildren();

          terms.slice(0, 5).forEach(item => {
            if (!item || !item.term || !item.definition) return;

            const row = document.createElement("div");
            row.className = "term-item";

            const term = document.createElement("strong");
            term.textContent = item.term;

            const definition = document.createElement("span");
            definition.textContent = item.definition;

            row.append(term, definition);
            elements.termsList.appendChild(row);
          });

          elements.termsSection.hidden =
            !elements.termsList.childElementCount;
        }
      } catch (error) {
        if (requestId !== summaryRequestId) return;

        console.error("쉬운 설명 오류:", error);
        setSummaryStatus(
          "쉬운 설명을 불러오지 못했어요. (" +
          (error.message || "AI 요청 오류") +
          ") 잠시 후 다시 시도해 주세요.",
          true
        );
      }
    }

    elements.categoryList.addEventListener("click", event => {
      const button = event.target.closest("[data-category]");
      if (!button) return;

      selectedCategory = button.dataset.category;

      elements.categoryList.querySelectorAll(".category-button")
        .forEach(item => {
          item.classList.toggle("active", item === button);
        });

      renderNews();
    });

    elements.refreshButton.addEventListener("click", loadNews);
    elements.homeBrand.addEventListener("click", showHome);
    elements.backButton.addEventListener("click", showHome);
    elements.backButtonBottom.addEventListener("click", showHome);

    window.addEventListener("popstate", () => {
      if (history.state?.view === "article" && currentArticle) {
        showArticle(currentArticle, false);
      } else {
        showHome(false);
      }
    });

    loadNews();
  </script>
</body>
</html>
