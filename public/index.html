<body>

  <script>
    "use strict";

    const API_NEWS = "/api/news";
    const API_SUMMARIZE = "/api/summarize";

    const CATEGORIES = [
      "경제", "주식", "정치", "사회", "국제", "기술", "일반"
    ];

    let allArticles = [];
    let currentArticle = null;
    let selectedCategory = "전체";

    const elements = {
      homeView: document.getElementById("homeView"),
      detailView: document.getElementById("detailView"),
      newsGrid: document.getElementById("newsGrid"),
      newsStatus: document.getElementById("newsStatus"),
      newsCount: document.getElementById("newsCount"),
      listHeading: document.getElementById("listHeading"),
      searchInput: document.getElementById("searchInput"),
      categoryList: document.getElementById("categoryList"),
      detailCategory: document.getElementById("detailCategory"),
      detailSource: document.getElementById("detailSource"),
      detailDate: document.getElementById("detailDate"),
      detailTitle: document.getElementById("detailTitle"),
      detailDescription: document.getElementById("detailDescription"),
      easyContent: document.getElementById("easyContent"),
      termsSection: document.getElementById("termsSection"),
      termsList: document.getElementById("termsList"),
      originalLink: document.getElementById("originalLink"),
      detailStatus: document.getElementById("detailStatus"),
      summarizeButton: document.getElementById("summarizeButton")
    };

    function cleanText(value) {
      if (value === null || value === undefined) return "";
      return String(value).replace(/<[^>]*>/g, " ").replace(/\s+/g, " ").trim();
    }

    function normaliseCategory(value) {
      const original = cleanText(value);
      const key = original.toLowerCase().trim();

      const aliases = {
        "경제": "경제",
        "economy": "경제",
        "business": "경제",
        "finance": "경제",
        "financial": "경제",

        "주식": "주식",
        "stock": "주식",
        "stocks": "주식",
        "shares": "주식",
        "market": "주식",
        "markets": "주식",

        "정치": "정치",
        "politics": "정치",
        "political": "정치",
        "government": "정치",

        "사회": "사회",
        "society": "사회",
        "education": "사회",
        "health": "사회",

        "국제": "국제",
        "international": "국제",
        "world": "국제",
        "global": "국제",

        "기술": "기술",
        "technology": "기술",
        "tech": "기술",
        "science": "기술",
        "it": "기술",

        "일반": "일반",
        "general": "일반",
        "other": "일반",
        "": "일반"
      };

      if (aliases[key]) return aliases[key];
      if (CATEGORIES.includes(original)) return original;

      return "일반";
    }

    function getCategory(article) {
      const suppliedCategory =
        article.category ??
        article.categoryName ??
        article.category_name ??
        article.section ??
        article.sectionName ??
        "";

      if (cleanText(suppliedCategory)) {
        return normaliseCategory(suppliedCategory);
      }

      const text = [
        article.title,
        article.originalTitle,
        article.description,
        article.content,
        article.source,
        article.domain
      ].map(cleanText).join(" ").toLowerCase();

      const keywordGroups = [
        {
          category: "주식",
          words: [
            "주식", "코스피", "코스닥", "증시", "상장", "주가",
            "주주", "배당", "공모주", "나스닥", "다우존스",
            "s&p 500", "stock", "shares", "nasdaq", "share price"
          ]
        },
        {
          category: "경제",
          words: [
            "경제", "금리", "물가", "인플레이션", "환율", "수출",
            "수입", "무역", "부동산", "집값", "고용", "실업",
            "한국은행", "연준", "gdp", "소비자물가", "경기",
            "economy", "inflation", "interest rate", "economic",
            "trade", "employment"
          ]
        },
        {
          category: "정치",
          words: [
            "대통령", "국회", "국회의원", "정당", "선거", "정부",
            "장관", "총리", "정치", "법안", "여당", "야당",
            "politics", "election", "parliament", "president",
            "minister", "government"
          ]
        },
        {
          category: "국제",
          words: [
            "미국", "중국", "일본", "유럽", "러시아", "우크라이나",
            "북한", "국제", "해외", "유엔", "나토", "외교",
            "전쟁", "정상회담", "백악관", "world", "international",
            "global", "foreign", "ukraine", "united nations"
          ]
        },
        {
          category: "기술",
          words: [
            "인공지능", "ai", "반도체", "로봇", "스마트폰",
            "소프트웨어", "테크", "기술", "데이터", "클라우드",
            "전기차", "배터리", "technology",
            "artificial intelligence", "semiconductor", "robot",
            "software", "smartphone"
          ]
        },
        {
          category: "사회",
          words: [
            "사건", "사고", "경찰", "법원", "교육", "학교",
            "복지", "환경", "건강", "의료", "노동", "범죄",
            "재판", "시민", "사회", "society", "education",
            "police", "court", "school", "health", "environment"
          ]
        }
      ];

      for (const group of keywordGroups) {
        if (group.words.some(word => text.includes(word))) {
          return group.category;
        }
      }

      return "일반";
    }

    function normalise(article) {
      const originalTitle = cleanText(
        article.originalTitle || article.title || article.name || "제목 없음"
      );

      const description = cleanText(
        article.description ||
        article.summary ||
        article.content ||
        article.snippet ||
        "이 뉴스에 대한 자세한 설명이 아직 제공되지 않았어요."
      );

      const link =
        article.link ||
        article.url ||
        article.articleUrl ||
        article.article_url ||
        "";

      const source = cleanText(
        article.source ||
        article.domain ||
        article.publisher ||
        article.provider ||
        "뉴스"
      );

      const pubDate =
        article.pubDate ||
        article.date ||
        article.publishedAt ||
        article.published_at ||
        "";

      return {
        ...article,
        originalTitle,
        title: originalTitle,
        description,
        link,
        source,
        pubDate,
        category: getCategory({
          ...article,
          title: originalTitle,
          description,
          source
        })
      };
    }

    function makeCategoryTag(categoryValue) {
      const category = normaliseCategory(categoryValue);
      const tag = document.createElement("span");

      tag.className = "category-tag";
      tag.dataset.category = category;
      tag.textContent = category;
      tag.style.display = "inline-flex";
      tag.style.visibility = "visible";
      tag.style.opacity = "1";

      return tag;
    }

    function formatDate(value) {
      if (!value) return "";

      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return cleanText(value);

      return new Intl.DateTimeFormat("ko-KR", {
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
      }).format(date);
    }

    function makeCard(article, index) {
      const card = document.createElement("article");
      card.className = "card";

      const content = document.createElement("div");
      content.className = "card-content";

      const title = document.createElement("h3");
      title.className = "card-title";
      title.textContent = article.originalTitle || article.title;

      const description = document.createElement("p");
      description.className = "card-description";
      description.textContent = article.description;

      const meta = document.createElement("div");
      meta.className = "card-meta";

      const category = makeCategoryTag(
        normaliseCategory(article.category)
      );

      const source = document.createElement("span");
      source.textContent = article.source || "뉴스";

      const date = document.createElement("span");
      date.textContent = formatDate(article.pubDate);

      meta.append(category, source);

      if (date.textContent) {
        meta.append(date);
      }

      const openButton = document.createElement("button");
      openButton.className = "card-open";
      openButton.type = "button";
      openButton.textContent = "쉬운 설명 읽기 →";
      openButton.addEventListener("click", () => showArticle(article));

      content.append(title, description, meta, openButton);
      card.append(content);

      return card;
    }

    function getFilteredArticles() {
      const query = cleanText(elements.searchInput.value).toLowerCase();

      return allArticles.filter(article => {
        const categoryMatches =
          selectedCategory === "전체" ||
          normaliseCategory(article.category) === selectedCategory;

        const searchableText = [
          article.originalTitle,
          article.description,
          article.source,
          article.category
        ].join(" ").toLowerCase();

        const queryMatches =
          !query || searchableText.includes(query);

        return categoryMatches && queryMatches;
      });
    }

    function renderNews() {
      const articles = getFilteredArticles();

      elements.newsGrid.replaceChildren();
      elements.newsCount.textContent = `${articles.length}개`;

      elements.listHeading.textContent =
        selectedCategory === "전체"
          ? "최신 뉴스"
          : `${selectedCategory} 뉴스`;

      elements.newsStatus.classList.remove("error");

      if (articles.length === 0) {
        elements.newsStatus.hidden = false;
        elements.newsStatus.textContent =
          allArticles.length === 0
            ? "표시할 뉴스가 없어요."
            : "조건에 맞는 뉴스가 없어요. 다른 카테고리나 검색어를 선택해 보세요.";

        return;
      }

      elements.newsStatus.hidden = true;

      articles.forEach((article, index) => {
        elements.newsGrid.append(makeCard(article, index));
      });
    }

    async function loadNews() {
      elements.newsStatus.hidden = false;
      elements.newsStatus.classList.remove("error");
      elements.newsStatus.textContent = "뉴스를 불러오고 있어요...";
      elements.newsGrid.replaceChildren();
      elements.newsCount.textContent = "불러오는 중...";

      try {
        const response = await fetch(API_NEWS, {
          method: "GET",
          headers: { "Accept": "application/json" },
          cache: "no-store"
        });

        if (!response.ok) {
          throw new Error(`뉴스 서버 오류 (${response.status})`);
        }

        const data = await response.json();

        const rawArticles = Array.isArray(data)
          ? data
          : Array.isArray(data.articles)
            ? data.articles
            : [];

        allArticles = rawArticles.map(normalise);

        renderNews();
      } catch (error) {
        console.error("뉴스 불러오기 실패:", error);

        elements.newsStatus.hidden = false;
        elements.newsStatus.classList.add("error");
        elements.newsStatus.textContent =
          "뉴스를 불러오지 못했어요. 인터넷 연결이나 뉴스 서버 설정을 확인해 주세요.";

        elements.newsCount.textContent = "오류";
      }
    }

    function setDetailStatus(message, isError = false) {
      elements.detailStatus.textContent = message;
      elements.detailStatus.classList.toggle("error", isError);
    }

    function showHome() {
      elements.detailView.classList.remove("visible");
      elements.homeView.hidden = false;
      currentArticle = null;

      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    async function showArticle(article) {
      currentArticle = normalise(article);

      elements.homeView.hidden = true;
      elements.detailView.classList.add("visible");

      elements.detailCategory.textContent =
        normaliseCategory(currentArticle.category);

      elements.detailCategory.dataset.category =
        normaliseCategory(currentArticle.category);

      elements.detailCategory.style.display = "inline-flex";
      elements.detailCategory.style.visibility = "visible";

      elements.detailSource.textContent = currentArticle.source || "뉴스";
      elements.detailDate.textContent = formatDate(currentArticle.pubDate);
      elements.detailTitle.textContent = currentArticle.originalTitle;
      elements.detailDescription.textContent = currentArticle.description;

      elements.easyContent.textContent = "쉬운 설명을 준비하고 있어요.";
      elements.termsList.replaceChildren();
      elements.termsSection.hidden = true;

      elements.originalLink.href =
        isSafeHttpUrl(currentArticle.link)
          ? currentArticle.link
          : "#";

      elements.originalLink.style.display =
        isSafeHttpUrl(currentArticle.link) ? "inline-block" : "none";

      setDetailStatus("");
      window.scrollTo({ top: 0, behavior: "smooth" });

      await summarizeArticle(currentArticle);
    }

    function isSafeHttpUrl(value) {
      try {
        const url = new URL(value);
        return url.protocol === "https:" || url.protocol === "http:";
      } catch {
        return false;
      }
    }

    async function summarizeArticle(article) {
      elements.summarizeButton.disabled = true;
      elements.summarizeButton.textContent = "설명 만드는 중...";
      elements.easyContent.textContent = "뉴스를 쉬운 말로 바꾸고 있어요.";
      setDetailStatus("");

      try {
        const response = await fetch(API_SUMMARIZE, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Accept": "application/json"
          },
          body: JSON.stringify({
            title: article.originalTitle,
            description: article.description,
            source: article.source,
            url: article.link
          })
        });

        const data = await response.json().catch(() => ({}));

        if (!response.ok) {
          throw new Error(
            data.error ||
            data.message ||
            `AI 설명 요청 실패 (${response.status})`
          );
        }

        const easyText =
          data.article ||
          data.summary ||
          data.explanation ||
          data.easyExplanation ||
          data.text ||
          "";

        if (!easyText) {
          throw new Error("서버에서 쉬운 설명을 받지 못했어요.");
        }

        elements.easyContent.textContent = easyText;

        const terms =
          Array.isArray(data.terms)
            ? data.terms
            : Array.isArray(data.keywords)
              ? data.keywords
              : [];

        elements.termsList.replaceChildren();

        terms.forEach(item => {
          const term = document.createElement("span");
          term.className = "term";

          if (typeof item === "string") {
            term.textContent = item;
          } else {
            const name = cleanText(item.name || item.term || "");
            const meaning = cleanText(item.meaning || item.description || "");
            term.textContent = meaning ? `${name}: ${meaning}` : name;
          }

          if (term.textContent) {
            elements.termsList.append(term);
          }
        });

        elements.termsSection.hidden = terms.length === 0;
      } catch (error) {
        console.error("쉬운 설명 생성 실패:", error);

        elements.easyContent.textContent =
          "지금은 AI 쉬운 설명을 만들지 못했어요.\n\n" +
          "잠시 후 아래 버튼을 눌러 다시 시도해 주세요. " +
          "문제가 계속되면 Cloudflare의 /api/summarize 설정과 서버 로그를 확인해야 해요.";

        setDetailStatus(
          error.message || "AI 설명을 만드는 중 문제가 발생했어요.",
          true
        );
      } finally {
        elements.summarizeButton.disabled = false;
        elements.summarizeButton.textContent = "↻ 쉬운 설명 다시 만들기";
      }
    }

    document.getElementById("backButton").addEventListener("click", showHome);

    document.getElementById("refreshButton").addEventListener("click", loadNews);

    document.getElementById("searchButton").addEventListener("click", renderNews);

    elements.searchInput.addEventListener("keydown", event => {
      if (event.key === "Enter") {
        renderNews();
      }
    });

    elements.searchInput.addEventListener("input", renderNews);

    elements.categoryList.addEventListener("click", event => {
      const button = event.target.closest("button[data-category]");
      if (!button) return;

      selectedCategory = button.dataset.category;

      elements.categoryList
        .querySelectorAll(".category-button")
        .forEach(item => {
          const active = item === button;
          item.classList.toggle("active", active);
          item.setAttribute("aria-pressed", String(active));
        });

      renderNews();
    });

    elements.summarizeButton.addEventListener("click", () => {
      if (currentArticle) {
        summarizeArticle(currentArticle);
      }
    });

    loadNews();
  </script>
</body>
</html>
