
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffc928">
<title>MANGO NEWS | 뉴스를 쉽게 읽다</title>
<style>
:root {
  --mango: #ffc928;
  --ink: #262626;
  --paper: #fffdf6;
  --line: #eee5cf;
  --muted: #737373;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: Arial, "Malgun Gothic", sans-serif;
  line-height: 1.6;
}
button { font: inherit; cursor: pointer; }
header {
  position: sticky;
  top: 0;
  z-index: 10;
  background: var(--mango);
  border-bottom: 1px solid #e7b21b;
}
.header-inner {
  max-width: 1150px;
  margin: auto;
  padding: 12px 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.logo {
  font-size: 24px;
  font-weight: 1000;
  cursor: pointer;
}
.logo small {
  display: block;
  font-size: 11px;
}
.actions { display: flex; gap: 7px; }
.btn {
  padding: 8px 13px;
  border: 1px solid #333;
  border-radius: 999px;
  background: white;
  font-weight: 800;
}
.btn.dark { background: #292929; color: white; }
main {
  max-width: 1150px;
  margin: auto;
  padding: 22px 18px 50px;
}
.hero {
  display: grid;
  grid-template-columns: 1.4fr .6fr;
  gap: 18px;
  align-items: center;
  padding: 26px;
  border: 1px solid #e7bd32;
  border-radius: 23px;
  background: linear-gradient(120deg, #ffedab, #ffc928);
}
.eyebrow { font-size: 12px; font-weight: 900; letter-spacing: 1px; }
.hero h1 { font-size: clamp(30px, 5vw, 46px); line-height: 1.15; margin: 8px 0; }
.hero p { margin: 0; }
.hero-art {
  display: grid;
  place-items: center;
  min-height: 155px;
  border-radius: 18px;
  background: #fff4c8;
  font-size: 95px;
}
.status {
  display: flex;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px;
  margin: 18px 0 10px;
  color: var(--muted);
  font-size: 13px;
}
.tabs {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 4px 0 15px;
}
.tab {
  flex: 0 0 auto;
  padding: 8px 15px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: white;
  font-weight: 800;
}
.tab.active { background: #292929; color: white; }
.section-head { margin: 6px 0 14px; }
.section-head h2 { margin: 0; font-size: 24px; }
.section-head p { margin: 0; font-size: 13px; color: var(--muted); }
.grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 16px;
}
.card {
  min-width: 0;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  border: 1px solid var(--line);
  border-radius: 17px;
  background: white;
  cursor: pointer;
}
.card-image {
  height: 190px;
  position: relative;
  overflow: hidden;
  background: #ffe8a0;
}
.card-image img { width: 100%; height: 100%; object-fit: cover; display: block; }
.fallback {
  width: 100%;
  height: 100%;
  display: grid;
  place-items: center;
  background: linear-gradient(135deg, #fff0b0, #ffc928);
  font-size: 58px;
}
.region {
  position: absolute;
  top: 9px;
  left: 9px;
  padding: 3px 9px;
  border-radius: 999px;
  background: white;
  font-size: 11px;
  font-weight: 900;
}
.card-content {
  flex: 1;
  display: flex;
  flex-direction: column;
  padding: 14px;
}
.meta {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
  color: var(--muted);
  font-size: 11px;
}
.pill {
  padding: 3px 8px;
  border-radius: 999px;
  background: #fff2bc;
  color: #614900;
  font-weight: 900;
}
.card h3 { margin: 9px 0; font-size: 18px; line-height: 1.4; }
.card p {
  margin: 0 0 14px;
  color: #606060;
  font-size: 13px;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.read {
  width: 100%;
  margin-top: auto;
  padding: 9px;
  border: 0;
  border-radius: 10px;
  background: #fff2bc;
  font-weight: 900;
}
.empty, .error {
  padding: 25px;
  border: 1px dashed #decf9e;
  border-radius: 15px;
  background: white;
  text-align: center;
}
.detail { display: none; }
.detail.visible { display: block; }
.home.hidden { display: none; }
.back { margin-bottom: 16px; }
.detail-panel {
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 20px;
  background: white;
}
.detail-image {
  width: 100%;
  max-height: 430px;
  object-fit: cover;
  background: #ffe8a0;
}
.detail-body {
  max-width: 850px;
  margin: auto;
  padding: clamp(18px, 4vw, 38px);
}
.detail-body h1 { font-size: clamp(25px, 4vw, 39px); line-height: 1.3; }
.description {
  padding: 12px 15px;
  border-left: 4px solid var(--mango);
  border-radius: 0 10px 10px 0;
  background: #fffaf0;
  color: #565656;
}
.ai-box {
  margin-top: 24px;
  padding: 18px;
  border: 1px solid #f0d77d;
  border-radius: 16px;
  background: #fffaf0;
}
.ai-box h2 { margin: 0 0 8px; font-size: 21px; }
.ai-text { white-space: pre-wrap; }
.term { padding: 10px 0; border-top: 1px solid var(--line); }
.term strong { color: #735400; }
.source-link { display: inline-block; margin-top: 18px; font-weight: 900; }
footer { padding: 28px 12px; color: var(--muted); font-size: 12px; text-align: center; }
[hidden] { display: none !important; }
@media (max-width: 800px) {
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .hero { grid-template-columns: 1fr; }
}
@media (max-width: 540px) {
  main { padding: 15px 11px 35px; }
  .header-inner { padding: 10px; }
  .logo { font-size: 19px; }
  .grid { grid-template-columns: 1fr; }
  .card-image { height: 215px; }
  .hero { padding: 20px; }
  .hero-art { display: none; }
}
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <div class="logo" id="homeLogo">
      🥭 MANGO NEWS
      <small>경제와 뉴스를 쉽게 읽다</small>
    </div>
    <div class="actions">
      <button class="btn" id="refreshButton">↻ 새로고침</button>
      <button class="btn dark" id="homeButton">홈으로</button>
    </div>
  </div>
</header>

<main>
  <section class="home" id="homeView">
    <div class="hero">
      <div>
        <div class="eyebrow">NEWS MADE SIMPLE</div>
        <h1>어려운 뉴스도<br>망고처럼 쉽게!</h1>
        <p>국내와 해외 뉴스를 읽고, 어려운 내용은 AI의 쉬운 설명으로 알아봐요.</p>
      </div>
      <div class="hero-art">🥭</div>
    </div>

    <div class="status">
      <span id="newsStatus">뉴스를 불러오는 중이에요…</span>
      <span id="regionStatus">국내 · 해외 뉴스</span>
    </div>

    <div class="tabs" id="categoryTabs">
      <button class="tab active" data-category="전체">전체</button>
      <button class="tab" data-category="경제">경제</button>
      <button class="tab" data-category="주식">주식</button>
      <button class="tab" data-category="정치">정치</button>
      <button class="tab" data-category="사회">사회</button>
      <button class="tab" data-category="국제">국제</button>
      <button class="tab" data-category="기술">기술</button>
      <button class="tab" data-category="일반">일반</button>
    </div>

    <div class="section-head">
      <h2 id="listTitle">오늘의 뉴스</h2>
      <p id="listDescription">기사를 누르면 쉬운 설명을 읽을 수 있어요.</p>
    </div>

    <div class="grid" id="newsGrid"></div>
    <div class="empty" id="emptyMessage" hidden>
      이 카테고리의 뉴스가 아직 없어요. 다른 카테고리도 확인해 주세요.
    </div>
  </section>

  <section class="detail" id="detailView">
    <button class="btn back" id="backButton">← 뉴스 목록으로</button>
    <article class="detail-panel">
      <img id="detailImage" class="detail-image" alt="기사 이미지" hidden>
      <div class="detail-body">
        <div class="meta">
          <span class="pill" id="detailCategory">뉴스</span>
          <span id="detailMeta"></span>
        </div>
        <h1 id="detailTitle"></h1>
        <p class="description" id="detailDescription"></p>

        <div class="ai-box">
          <h2>🍋 AI로 쉽게 설명하기</h2>
          <p id="aiStatus">기사를 쉬운 말로 바꾸고 있어요…</p>
          <div id="aiArticle" class="ai-text"></div>
          <div id="aiTerms"></div>
          <button class="btn" id="retryAI" hidden>↻ 다시 시도하기</button>
        </div>

        <a class="source-link" id="sourceLink" target="_blank" rel="noopener noreferrer">
          원문 기사 읽기 ↗
        </a>
      </div>
    </article>
  </section>
</main>

<footer>MANGO NEWS · 기사를 이해하기 쉽게 돕는 뉴스 안내 사이트입니다.</footer>

<script>
"use strict";

const API_NEWS = "/api/news";
const API_SUMMARIZE = "/api/summarize";
const API_IMAGE_SEARCH = "/api/image-search";
const MAX_ARTICLES = 100;

const $ = id => document.getElementById(id);

const state = {
  articles: [],
  category: "전체",
  currentArticle: null,
  imageCache: new Map()
};

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  }[char]));
}

function formatDate(value) {
  if (!value) return "";
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return "";
  return new Intl.DateTimeFormat("ko-KR", {
    month: "long",
    day: "numeric",
    hour: "2-digit",
    minute: "2-digit"
  }).format(date);
}

function guessCategory(article) {
  const text = (
    (article.title || "") + " " + (article.description || "")
  ).toLowerCase();

  if (/주식|증시|코스피|코스닥|상장|주가|배당|나스닥|stock market|shares|stocks/.test(text)) return "주식";
  if (/경제|금리|물가|환율|은행|금융|수출|수입|무역|부동산|고용|실업|inflation|interest rate|economy|business/.test(text)) return "경제";
  if (/대통령|국회|국회의원|정당|선거|정부|장관|정치|법안|president|election|parliament|politics/.test(text)) return "정치";
  if (/인공지능|\bai\b|반도체|로봇|스마트폰|컴퓨터|인터넷|우주|과학|기술|소프트웨어|technology|artificial intelligence|science/.test(text)) return "기술";
  if (/사건|사고|경찰|법원|학교|학생|교육|병원|건강|환경|화재|교통|범죄|시민|지역|school|court|health|environment/.test(text)) return "사회";
  if (/미국|중국|일본|북한|유럽|러시아|우크라이나|중동|전쟁|국제|세계|해외|international|world|united states|china|japan|europe/.test(text)) return "국제";
  return "일반";
}

function normalise(article) {
  const title = String(article.title || article.originalTitle || "").trim();

  return {
    ...article,
    title,
    originalTitle: article.originalTitle || title,
    description: String(article.description || "").trim(),
    url: String(article.url || article.link || "").trim(),
    domain: article.domain || article.source || "뉴스",
    date: article.date || article.pubDate || "",
    image: article.image || "",
    region: article.region || "국내",
    category: article.category || guessCategory(article)
  };
}

function fallbackEmoji(category) {
  const icons = {
    경제: "💹",
    주식: "📈",
    정치: "🏛️",
    사회: "🏙️",
    국제: "🌏",
    기술: "🤖",
    일반: "🥭"
  };
  return icons[category] || "🥭";
}

function makeFallback(category) {
  const div = document.createElement("div");
  div.className = "fallback";
  div.textContent = fallbackEmoji(category);
  div.setAttribute("aria-label", "대체 이미지");
  return div;
}

async function getArticleImage(article) {
  if (article.image && /^https?:\/\//i.test(article.image)) {
    return article.image;
  }

  if (state.imageCache.has(article.url)) {
    return state.imageCache.get(article.url);
  }

  try {
    const response = await fetch(
      API_IMAGE_SEARCH + "?title=" + encodeURIComponent(article.title)
    );

    if (!response.ok) return "";

    const data = await response.json();
    const image = data.image || "";

    if (!/^https:\/\/upload\.wikimedia\.org\//i.test(image)) {
      state.imageCache.set(article.url, "");
      return "";
    }

    state.imageCache.set(article.url, image);
    return image;
  } catch {
    state.imageCache.set(article.url, "");
    return "";
  }
}

function prepareCardImage(imageArea, article) {
  imageArea.replaceChildren(makeFallback(article.category));

  const region = document.createElement("span");
  region.className = "region";
  region.textContent = article.region === "해외" ? "해외 뉴스" : "국내 뉴스";
  imageArea.appendChild(region);

  const observer = new IntersectionObserver(entries => {
    if (!entries.some(entry => entry.isIntersecting)) return;
    observer.disconnect();

    getArticleImage(article).then(url => {
      if (!imageArea.isConnected || !url) return;

      const img = document.createElement("img");
      img.alt = article.title + " 이미지";
      img.loading = "lazy";
      img.src = url;

      img.onerror = () => {
        img.replaceWith(makeFallback(article.category));
      };

      imageArea.prepend(img);
    });
  }, { rootMargin: "250px" });

  observer.observe(imageArea);
}

function renderNews() {
  const grid = $("newsGrid");
  grid.replaceChildren();

  const filtered = state.category === "전체"
    ? state.articles
    : state.articles.filter(
        article => article.category === state.category
      );

  $("listTitle").textContent = state.category === "전체"
    ? "오늘의 뉴스"
    : state.category + " 뉴스";

  $("listDescription").textContent =
    "총 " + filtered.length +
    "개 · 기사를 누르면 쉬운 설명을 읽을 수 있어요.";

  $("emptyMessage").hidden = filtered.length > 0;

  const fragment = document.createDocumentFragment();

  filtered.slice(0, MAX_ARTICLES).forEach(article => {
    const card = document.createElement("article");
    card.className = "card";

    const imageArea = document.createElement("div");
    imageArea.className = "card-image";
    prepareCardImage(imageArea, article);

    const content = document.createElement("div");
    content.className = "card-content";

    const meta = document.createElement("div");
    meta.className = "meta";

    const category = document.createElement("span");
    category.className = "pill";
    category.textContent = article.category;

    const source = document.createElement("span");
    source.textContent = article.domain;

    const date = document.createElement("span");
    date.textContent = formatDate(article.date);

    meta.append(category, source, date);

    const title = document.createElement("h3");
    title.textContent = article.title;

    const description = document.createElement("p");
    description.textContent = article.description ||
      "기사 설명이 없어요. 기사를 열어 쉬운 설명을 확인해 보세요.";

    const button = document.createElement("button");
    button.className = "read";
    button.textContent = "쉬운 설명 읽기 →";
    button.addEventListener("click", event => {
      event.stopPropagation();
      showArticle(article);
    });

    content.append(meta, title, description, button);
    card.append(imageArea, content);
    card.addEventListener("click", () => showArticle(article));

    fragment.appendChild(card);
  });

  grid.appendChild(fragment);
}

async function loadNews(force = false) {
  $("newsStatus").textContent = "뉴스를 불러오는 중이에요…";
  $("refreshButton").disabled = true;

  try {
    const response = await fetch(
      API_NEWS + (force ? "?refresh=1" : ""),
      { cache: "no-store" }
    );

    const data = await response.json();

    if (!response.ok || !Array.isArray(data.articles)) {
      throw new Error(data.error || "뉴스를 불러오지 못했어요.");
    }

    state.articles = data.articles
      .map(normalise)
      .filter(article => article.title && article.url);

    $("newsStatus").textContent =
      "뉴스 " + state.articles.length + "개 · " +
      (data.updatedAt ? "업데이트 " + formatDate(data.updatedAt) : "최신 뉴스");

    const domestic = state.articles.filter(a => a.region === "국내").length;
    const international = state.articles.filter(a => a.region === "해외").length;

    $("regionStatus").textContent =
      "국내 " + domestic + "개 · 해외 " + international + "개";

    renderNews();
  } catch (error) {
    $("newsStatus").textContent = "뉴스를 불러오지 못했어요.";
    $("newsGrid").replaceChildren();

    const message = document.createElement("div");
    message.className = "error";
    message.textContent =
      "뉴스를 불러오지 못했어요. " +
      (error.message || "") + " ";

    const retry = document.createElement("button");
    retry.className = "btn";
    retry.textContent = "다시 시도";
    retry.addEventListener("click", () => loadNews(true));

    message.appendChild(retry);
    $("newsGrid").appendChild(message);
  } finally {
    $("refreshButton").disabled = false;
  }
}

async function showArticle(article) {
  state.currentArticle = article;

  $("homeView").classList.add("hidden");
  $("detailView").classList.add("visible");

  $("detailTitle").textContent = article.title;
  $("detailCategory").textContent = article.category;
  $("detailMeta").textContent =
    article.domain + " · " + formatDate(article.date);
  $("detailDescription").textContent =
    article.description || "출처에서 별도의 설명을 제공하지 않았어요.";

  $("sourceLink").href = article.url;
  $("aiStatus").textContent = "AI가 쉬운 설명을 만들고 있어요…";
  $("aiArticle").textContent = "";
  $("aiTerms").replaceChildren();
  $("retryAI").hidden = true;
  $("detailImage").hidden = true;

  window.scrollTo(0, 0);

  getArticleImage(article).then(url => {
    if (state.currentArticle?.url !== article.url || !url) return;

    $("detailImage").src = url;
    $("detailImage").hidden = false;
    $("detailImage").onerror = () => {
      $("detailImage").hidden = true;
    };
  });

  await summarize(article);
}

async function summarize(article) {
  $("aiStatus").textContent = "AI가 쉬운 설명을 만들고 있어요…";
  $("retryAI").hidden = true;

  try {
    const response = await fetch(API_SUMMARIZE, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        title: article.title,
        originalTitle: article.originalTitle || article.title,
        description: article.description
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "AI 설명을 만들지 못했어요.");
    }

    if (state.currentArticle?.url !== article.url) return;

    $("aiStatus").textContent =
      data.titleKo && data.titleKo !== article.title
        ? data.titleKo
        : "쉬운 설명";

    $("aiArticle").textContent =
      data.article || "설명을 만들지 못했어요.";

    $("aiTerms").replaceChildren();

    if (Array.isArray(data.terms) && data.terms.length) {
      const heading = document.createElement("h3");
      heading.textContent = "어려운 단어 풀이";
      $("aiTerms").appendChild(heading);

      data.terms.forEach(item => {
        const row = document.createElement("div");
        row.className = "term";

        const term = document.createElement("strong");
        term.textContent = item.term || "";

        const definition = document.createElement("div");
        definition.textContent = item.definition || "";

        row.append(term, definition);
        $("aiTerms").appendChild(row);
      });
    }
  } catch (error) {
    $("aiStatus").textContent =
      error.message || "AI 설명을 만들지 못했어요.";
    $("retryAI").hidden = false;
  }
}

function showHome() {
  $("detailView").classList.remove("visible");
  $("homeView").classList.remove("hidden");
  state.currentArticle = null;
  window.scrollTo(0, 0);
}

$("categoryTabs").addEventListener("click", event => {
  const button = event.target.closest("[data-category]");
  if (!button) return;

  state.category = button.dataset.category;

  document.querySelectorAll(".tab").forEach(tab => {
    tab.classList.toggle("active", tab === button);
  });

  renderNews();
});

$("refreshButton").addEventListener("click", () => loadNews(true));
$("homeButton").addEventListener("click", showHome);
$("homeLogo").addEventListener("click", showHome);
$("backButton").addEventListener("click", showHome);
$("retryAI").addEventListener("click", () => {
  if (state.currentArticle) summarize(state.currentArticle);
});

loadNews();
</script>
</body>
</html>
