
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffc928">
  <title>MANGO NEWS | 경제와 주식을 쉽게 읽다</title>

  <style>
    :root {
      --mango: #ffc928;
      --mango-light: #fff2b8;
      --ink: #28251e;
      --muted: #817b6e;
      --paper: #fffdf7;
      --white: #ffffff;
      --line: #eee7d7;
      --green: #587b45;
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      font-family: Arial, "Malgun Gothic", "맑은 고딕", sans-serif;
      line-height: 1.65;
    }

    button, input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    a {
      color: inherit;
    }

    [hidden] {
      display: none !important;
    }

    .top-strip {
      height: 7px;
      background: var(--mango);
    }

    .site-header {
      background: var(--white);
      border-bottom: 1px solid var(--line);
    }

    .header-inner {
      max-width: 1120px;
      margin: auto;
      padding: 20px 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .brand {
      border: 0;
      padding: 0;
      background: transparent;
      text-align: left;
      color: var(--ink);
    }

    .brand-name {
      display: block;
      font-size: 30px;
      line-height: 1.2;
      font-weight: 950;
      letter-spacing: -1.2px;
    }

    .brand-name span {
      color: #e8a900;
    }

    .brand-subtitle {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
    }

    .header-badge {
      background: var(--mango-light);
      padding: 7px 12px;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    main {
      max-width: 1120px;
      min-height: 70vh;
      padding: 26px 22px 60px;
      margin: auto;
    }

    .hero {
      position: relative;
      overflow: hidden;
      display: grid;
      grid-template-columns: 1.4fr .6fr;
      align-items: center;
      gap: 20px;
      padding: 30px;
      border-radius: 24px;
      background: var(--mango);
      margin-bottom: 30px;
    }

    .hero-content {
      position: relative;
      z-index: 1;
    }

    .hero-label {
      display: inline-block;
      padding: 4px 11px;
      border-radius: 99px;
      background: rgba(255,255,255,.7);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .hero h1 {
      margin: 13px 0 10px;
      font-size: clamp(27px, 4vw, 40px);
      line-height: 1.3;
      letter-spacing: -1.5px;
    }

    .hero p {
      max-width: 580px;
      margin: 0;
      color: #5c4a17;
      font-size: 14px;
    }

    .hero-image-wrap {
      position: relative;
      z-index: 1;
      min-width: 0;
    }

    .hero-image {
      display: block;
      width: 100%;
      height: 205px;
      object-fit: cover;
      border: 5px solid rgba(255,255,255,.65);
      border-radius: 20px;
      background: #ffe28a;
    }

    .hero-image-fallback {
      display: grid;
      width: 100%;
      height: 205px;
      place-items: center;
      border-radius: 20px;
      background: rgba(255,255,255,.35);
      font-size: 100px;
    }

    .section-heading {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 12px;
      margin: 27px 0 16px;
    }

    .section-heading h2 {
      margin: 0;
      font-size: 23px;
      letter-spacing: -.6px;
    }

    .section-heading p {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .refresh-button {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 9px 13px;
      background: var(--white);
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
    }

    .refresh-button:hover {
      background: var(--mango-light);
    }

    .category-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 22px;
    }

    .category-button {
      padding: 8px 15px;
      border: 1px solid var(--line);
      border-radius: 99px;
      background: var(--white);
      color: #625d51;
      font-size: 13px;
      font-weight: 800;
    }

    .category-button.active {
      border-color: var(--mango);
      background: var(--mango);
      color: var(--ink);
    }

    .status {
      padding: 22px 16px;
      margin: 15px 0;
      border: 1px dashed #e6d8b1;
      border-radius: var(--radius);
      background: #fffaf0;
      color: #655a3b;
      text-align: center;
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    .status.error {
      color: #a32b2b;
      background: #fff5f3;
      border-color: #f0c9c3;
    }

    .news-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .news-card {
      min-width: 0;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--white);
      transition: transform .15s ease, box-shadow .15s ease;
    }

    .news-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 22px rgba(100, 77, 12, .08);
    }

    .card-image-button {
      display: block;
      width: 100%;
      height: 210px;
      padding: 0;
      overflow: hidden;
      border: 0;
      background: #fff2c9;
    }

    .card-image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform .25s ease;
    }

    .card-image-button:hover .card-image {
      transform: scale(1.035);
    }

    .image-placeholder {
      display: grid;
      width: 100%;
      height: 100%;
      place-items: center;
      background: linear-gradient(135deg, #fff3c5, #ffe28a);
      color: #8a6b17;
      font-size: 48px;
    }

    .card-body {
      padding: 17px 18px 16px;
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }

    .category-tag {
      display: inline-block;
      padding: 4px 9px;
      border-radius: 7px;
      background: var(--mango-light);
      font-size: 11px;
      font-weight: 900;
      white-space: nowrap;
    }

    .source-name {
      overflow: hidden;
      color: var(--muted);
      font-size: 11px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .news-title {
      display: block;
      width: 100%;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--ink);
      font-size: 17px;
      font-weight: 900;
      line-height: 1.55;
      text-align: left;
      overflow-wrap: anywhere;
    }

    .news-title:hover {
      color: #8a6800;
    }

    /* 노란색 형광펜 강조 */
/* 망고 뉴스의 노란색 형광펜 밑줄 */
mark {
  color: inherit;
  background: linear-gradient(
    to bottom,
    transparent 58%,
    #ffe36b 58%,
    #ffe36b 88%,
    transparent 88%
  );
  background-repeat: no-repeat;
  padding: 0 2px;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
  border-radius: 2px;
}

/* 쉬운 설명 속 강조 단어 */
.easy-article mark,
.terms-section mark {
  background: linear-gradient(
    to bottom,
    transparent 60%,
    #ffe36b 60%,
    #ffe36b 90%,
    transparent 90%
  );
  padding: 0 2px;
  border-radius: 2px;
}


    .news-description {
      margin: 9px 0 0;
      color: #777164;
      font-size: 13px;
      line-height: 1.7;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 3;
      overflow: hidden;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-top: 14px;
      padding-top: 11px;
      border-top: 1px solid #f3eee2;
    }

    .news-date {
      color: #8c8679;
      font-size: 11px;
    }

    .read-more {
      color: #8b6800;
      font-size: 12px;
      font-weight: 900;
      white-space: nowrap;
    }

    .detail-view {
      max-width: 850px;
      margin: 0 auto;
    }

    .back-button {
      padding: 9px 14px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: var(--white);
      font-size: 13px;
      font-weight: 900;
    }

    .back-button:hover {
      background: var(--mango-light);
    }

    .detail-paper {
      margin-top: 17px;
      padding: clamp(18px, 4vw, 36px);
      border: 1px solid var(--line);
      border-radius: 22px;
      background: var(--white);
    }

    .detail-image {
      display: block;
      width: 100%;
      max-height: 430px;
      object-fit: cover;
      border-radius: 16px;
      background: #fff2c9;
      margin-bottom: 23px;
    }

    .detail-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 9px;
      margin-bottom: 14px;
      color: var(--muted);
      font-size: 12px;
    }

    .detail-title {
      margin: 0 0 17px;
      font-size: clamp(24px, 4vw, 35px);
      line-height: 1.45;
      letter-spacing: -.8px;
      overflow-wrap: anywhere;
    }

    .detail-description {
      padding: 15px 17px;
      border-radius: 12px;
      background: #fffaf0;
      color: #6e6655;
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    .detail-divider {
      height: 1px;
      margin: 24px 0;
      background: var(--line);
    }

    .easy-heading {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 15px;
      font-size: 20px;
    }

    .easy-heading .emoji {
      display: grid;
      width: 40px;
      height: 40px;
      place-items: center;
      flex-shrink: 0;
      border-radius: 12px;
      background: var(--mango-light);
    }

    .easy-article {
      color: #39372f;
      font-size: 16px;
      line-height: 2;
      overflow-wrap: anywhere;
    }

    .easy-article p {
      margin: 0 0 14px;
    }

    .terms-section {
      margin-top: 28px;
      padding: 18px;
      border-radius: 15px;
      background: #fffaf0;
    }

    .terms-section h3 {
      margin: 0 0 12px;
      font-size: 16px;
    }

    .term-item {
      padding: 11px 0;
      border-top: 1px solid #eee4cb;
      font-size: 13px;
    }

    .term-item strong {
      display: block;
      margin-bottom: 3px;
      color: #8b6800;
    }

    .original-link {
      display: inline-flex;
      margin-top: 22px;
      padding: 11px 15px;
      border-radius: 11px;
      background: var(--mango);
      color: var(--ink);
      text-decoration: none;
      font-size: 13px;
      font-weight: 900;
    }

    .original-link:hover {
      background: #f0b900;
    }

    .footer {
      padding: 25px 20px;
      border-top: 1px solid var(--line);
      background: #fffaf0;
      color: #827965;
      text-align: center;
      font-size: 12px;
    }

    @media (max-width: 700px) {
      .header-inner {
        padding: 17px 15px;
      }

      .brand-name {
        font-size: 25px;
      }

      .header-badge {
        font-size: 10px;
        padding: 6px 8px;
      }

      main {
        padding: 18px 14px 40px;
      }

      .hero {
        grid-template-columns: 1fr;
        padding: 23px 20px;
      }

      .hero-image,
      .hero-image-fallback {
        height: 175px;
      }

      .news-grid {
        grid-template-columns: 1fr;
      }

      .card-image-button {
        height: 205px;
      }

      .category-button {
        padding: 7px 12px;
      }
    }
  </style>
</head>

<body>
  <div class="top-strip"></div>

  <header class="site-header">
    <div class="header-inner">
      <button class="brand" id="homeBrand" type="button">
        <span class="brand-name">🥭 MANGO <span>NEWS</span></span>
        <span class="brand-subtitle">경제와 뉴스를 쉽게 읽다</span>
      </button>
      <span class="header-badge">어린이를 위한 쉬운 뉴스</span>
    </div>
  </header>

  <main>
    <section id="homeView">
      <section class="hero">
        <div class="hero-content">
          <span class="hero-label">MANGO NEWS</span>
          <h1>어려운 뉴스도<br><mark>쉽고 재미있게!</mark></h1>
          <p>
            세상에서 일어나는 일을 알아봐요.
            뉴스 제목을 누르면 쉬운 설명과 어려운 단어의 뜻을 읽을 수 있어요.
          </p>
        </div>

        <div class="hero-image-wrap">
          <img
            id="heroImage"
            class="hero-image"
            src="https://images.unsplash.com/photo-1553279768-865429fa0078?auto=format&fit=crop&w=900&q=80"
            alt="노란 망고"
          >
        </div>
      </section>

      <div class="section-heading">
        <div>
          <h2>오늘의 뉴스 <mark>핵심 모아보기</mark></h2>
          <p id="updateText">최신 뉴스를 불러오고 있어요.</p>
        </div>
        <button class="refresh-button" id="refreshButton" type="button">
          ↻ 새로고침
        </button>
      </div>

      <nav class="category-list" id="categoryList" aria-label="뉴스 카테고리">
        <button class="category-button active" data-category="전체" type="button">전체</button>
        <button class="category-button" data-category="경제" type="button">경제</button>
        <button class="category-button" data-category="주식" type="button">주식</button>
        <button class="category-button" data-category="정치" type="button">정치</button>
        <button class="category-button" data-category="사회" type="button">사회</button>
        <button class="category-button" data-category="국제" type="button">국제</button>
        <button class="category-button" data-category="기술" type="button">기술</button>
        <button class="category-button" data-category="일반" type="button">일반</button>
      </nav>

      <div id="newsStatus" class="status" role="status">
        뉴스를 불러오고 있어요. 잠시만 기다려 주세요.
      </div>

      <section id="newsGrid" class="news-grid" aria-label="뉴스 목록"></section>
    </section>

    <section id="detailView" class="detail-view" hidden>
      <button id="backButton" class="back-button" type="button">
        ← 홈으로 돌아가기
      </button>

      <article class="detail-paper">
        <img id="detailImage" class="detail-image" alt="" hidden>

        <div class="detail-meta">
          <span id="detailCategory" class="category-tag">일반</span>
          <span id="detailSource"></span>
          <span id="detailDate"></span>
        </div>

        <h1 id="detailTitle" class="detail-title"></h1>

        <div id="detailDescription" class="detail-description" hidden></div>

        <div class="detail-divider"></div>

        <section aria-labelledby="easyTitle">
          <h2 class="easy-heading" id="easyTitle">
            <span class="emoji">💡</span>
            <span>초등학생도 이해하는 쉬운 설명</span>
          </h2>

          <div id="summaryStatus" class="status" role="status">
            기사를 쉽게 설명하고 있어요.
          </div>

          <div id="easyArticle" class="easy-article"></div>

          <section id="termsSection" class="terms-section" hidden>
            <h3>📖 어려운 단어 알아보기</h3>
            <div id="termsList"></div>
          </section>
        </section>

        <a id="originalLink" class="original-link"
           href="#" target="_blank" rel="noopener noreferrer">
          원문 기사 보기 ↗
        </a>
      </article>

      <div style="margin-top:18px">
        <button id="backButtonBottom" class="back-button" type="button">
          ← 뉴스 목록으로
        </button>
      </div>
    </section>
  </main>

  <footer class="footer">
    🥭 MANGO NEWS · 어려운 뉴스를 쉽고 바르게 이해해요.
  </footer>

  <script>
    const API_NEWS = "/api/news";
    const API_SUMMARIZE = "/api/summarize";
    const API_IMAGE_SEARCH = "/api/image-search";

    const elements = {
      homeView: document.getElementById("homeView"),
      detailView: document.getElementById("detailView"),
      newsGrid: document.getElementById("newsGrid"),
      newsStatus: document.getElementById("newsStatus"),
      updateText: document.getElementById("updateText"),
      categoryList: document.getElementById("categoryList"),
      refreshButton: document.getElementById("refreshButton"),
      homeBrand: document.getElementById("homeBrand"),
      backButton: document.getElementById("backButton"),
      backButtonBottom: document.getElementById("backButtonBottom"),
      detailImage: document.getElementById("detailImage"),
      detailCategory: document.getElementById("detailCategory"),
      detailSource: document.getElementById("detailSource"),
      detailDate: document.getElementById("detailDate"),
      detailTitle: document.getElementById("detailTitle"),
      detailDescription: document.getElementById("detailDescription"),
      summaryStatus: document.getElementById("summaryStatus"),
      easyArticle: document.getElementById("easyArticle"),
      termsSection: document.getElementById("termsSection"),
      termsList: document.getElementById("termsList"),
      originalLink: document.getElementById("originalLink"),
      heroImage: document.getElementById("heroImage")
    };

    let allArticles = [];
    let selectedCategory = "전체";
    let currentArticle = null;
    let summaryRequestId = 0;
    const imageCache = new Map();

    function cleanText(value) {
      return String(value || "")
        .replace(/[\u200B-\u200D\uFEFF]/g, "")
        .trim();
    }

    function safeURL(value) {
      try {
        const url = new URL(value, location.origin);
        if (url.protocol === "https:" || url.protocol === "http:") {
          return url.href;
        }
      } catch (_) {}
      return "";
    }

    function formatDate(value) {
      if (!value) return "날짜 정보 없음";

      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return value;

      return new Intl.DateTimeFormat("ko-KR", {
        year: "numeric",
        month: "long",
        day: "numeric",
        hour: "2-digit",
        minute: "2-digit"
      }).format(date);
    }

    function getCategory(article) {
      const supplied = cleanText(article.category || article.section);
      const aliases = {
        "经济": "경제",
        "경제": "경제",
        "금융": "경제",
        "주식": "주식",
        "증시": "주식",
        "정치": "정치",
        "社会": "사회",
        "사회": "사회",
        "국제": "국제",
        "세계": "국제",
        "기술": "기술",
        "과학": "기술",
        "IT": "기술",
        "일반": "일반"
      };

      if (aliases[supplied]) return aliases[supplied];

      const title = (
        (article.originalTitle || article.title || "") + " " +
        (article.description || "")
      ).toLowerCase();

      if (/주식|증시|코스피|코스닥|상장|주가|주주|배당|nasdaq|stock market/.test(title)) {
        return "주식";
      }

      if (/경제|금리|물가|환율|은행|금융|수출|수입|무역|부동산|경기|고용|실업|inflation|interest rate/.test(title)) {
        return "경제";
      }

      if (/대통령|국회|국회의원|정당|선거|정부|장관|정치|법안|president|election|parliament/.test(title)) {
        return "정치";
      }

      if (/인공지능|\bai\b|반도체|로봇|스마트폰|컴퓨터|인터넷|우주|과학|기술|소프트웨어|technology|artificial intelligence/.test(title)) {
        return "기술";
      }

      if (/미국|중국|일본|한국|북한|유럽|러시아|우크라이나|중동|전쟁|국제|세계|해외|international|world news|united states/.test(title)) {
        return "국제";
      }

      if (/사건|사고|경찰|법원|학교|학생|교육|병원|건강|환경|화재|교통|범죄|시민|지역|사회|school|court/.test(title)) {
        return "사회";
      }

      return "일반";
    }

    function normalise(article) {
      const originalTitle = cleanText(
        article.originalTitle || article.title || "제목 없음"
      );

      return {
        ...article,
        title: originalTitle,
        originalTitle,
        description: cleanText(article.description || ""),
        url: safeURL(article.url || article.link || ""),
        domain: cleanText(article.domain || article.source || "뉴스"),
        date: cleanText(article.date || article.pubDate || ""),
        image: safeURL(article.image || article.imageUrl || ""),
        category: getCategory(article)
      };
    }

    /*
      형광펜은 HTML mark 태그로 표시합니다.
      제목의 실제 내용은 바꾸지 않고, 화면에 표시할 때만 강조합니다.
    */
    function highlightTitle(title) {
      const safe = escapeHTML(title);
      const terms = [
        "긴급", "속보", "급등", "급락", "금리", "물가",
        "주식", "경제", "인공지능", "AI", "전쟁", "선거",
        "수출", "수입", "반도체", "기후", "환경"
      ];

      const pattern = new RegExp(
        "(" + terms.map(escapeRegExp).join("|") + ")",
        "gi"
      );

      return safe.replace(pattern, "<mark>$1</mark>");
    }

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[char]);
    }

    function escapeRegExp(value) {
      return value.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    }

    function makeImagePlaceholder() {
      const placeholder = document.createElement("div");
      placeholder.className = "image-placeholder";
      placeholder.textContent = "🥭";
      return placeholder;
    }

    async function findArticleImage(article) {
      if (article.image) return article.image;
      if (!article.title) return "";

      const cacheKey = article.title;
      if (imageCache.has(cacheKey)) return imageCache.get(cacheKey);

      try {
        const response = await fetch(
          API_IMAGE_SEARCH + "?title=" + encodeURIComponent(article.title),
          { headers: { "Accept": "application/json" } }
        );

        if (!response.ok) {
          imageCache.set(cacheKey, "");
          return "";
        }

        const data = await response.json();
        const image = safeURL(data.image || "");

        imageCache.set(cacheKey, image);
        return image;
      } catch (error) {
        console.warn("기사 이미지 검색 실패:", error);
        imageCache.set(cacheKey, "");
        return "";
      }
    }

    function loadCardImage(img, placeholder, article) {
      if (article.image) {
        img.src = article.image;
        img.hidden = false;
        placeholder.hidden = true;
      }

      findArticleImage(article).then(url => {
        if (!url || !img.isConnected) return;

        img.onload = () => {
          img.hidden = false;
          placeholder.hidden = true;
        };

        img.onerror = () => {
          img.hidden = true;
          placeholder.hidden = false;
        };

        img.src = url;
      });
    }

    function makeCard(article) {
      const card = document.createElement("article");
      card.className = "news-card";

      const imageButton = document.createElement("button");
      imageButton.type = "button";
      imageButton.className = "card-image-button";
      imageButton.setAttribute("aria-label", "기사 열기: " + article.title);
      imageButton.addEventListener("click", () => showArticle(article));

      const placeholder = makeImagePlaceholder();
      const image = document.createElement("img");
      image.className = "card-image";
      image.alt = article.title;
      image.loading = "lazy";
      image.hidden = true;

      image.onerror = () => {
        image.hidden = true;
        placeholder.hidden = false;
      };

      imageButton.append(placeholder, image);
      loadCardImage(image, placeholder, article);

      const body = document.createElement("div");
      body.className = "card-body";

      const top = document.createElement("div");
      top.className = "card-top";

      const tag = document.createElement("span");
      tag.className = "category-tag";
      tag.textContent = article.category;

      const source = document.createElement("span");
      source.className = "source-name";
      source.textContent = article.domain;

      top.append(tag, source);

      const title = document.createElement("button");
      title.type = "button";
      title.className = "news-title";
      title.innerHTML = highlightTitle(article.title);
      title.addEventListener("click", () => showArticle(article));

      const description = document.createElement("p");
      description.className = "news-description";
      description.textContent =
        article.description || "제목을 눌러 이 뉴스의 쉬운 설명을 읽어 보세요.";

      const footer = document.createElement("div");
      footer.className = "card-footer";

      const date = document.createElement("span");
      date.className = "news-date";
      date.textContent = formatDate(article.date);

      const readMore = document.createElement("span");
      readMore.className = "read-more";
      readMore.textContent = "쉽게 읽기 →";

      footer.append(date, readMore);
      body.append(top, title, description, footer);
      card.append(imageButton, body);

      return card;
    }

    function renderNews() {
      elements.newsGrid.replaceChildren();

      const filtered = selectedCategory === "전체"
        ? allArticles
        : allArticles.filter(
            article => article.category === selectedCategory
          );

      if (!filtered.length) {
        elements.newsStatus.hidden = false;
        elements.newsStatus.textContent = allArticles.length
          ? "이 카테고리에는 아직 기사가 없어요. 다른 카테고리를 눌러 보세요."
          : "표시할 뉴스가 없어요. 잠시 후 새로고침해 주세요.";
        return;
      }

      elements.newsStatus.hidden = true;
      const fragment = document.createDocumentFragment();

      filtered.forEach(article => {
        fragment.appendChild(makeCard(article));
      });

      elements.newsGrid.appendChild(fragment);
    }

    async function loadNews() {
      elements.refreshButton.disabled = true;
      elements.refreshButton.textContent = "불러오는 중…";
      elements.newsStatus.hidden = false;
      elements.newsStatus.classList.remove("error");
      elements.newsStatus.textContent = "최신 뉴스를 불러오고 있어요.";

      try {
        const response = await fetch(API_NEWS, {
          method: "GET",
          cache: "no-store",
          headers: { "Accept": "application/json" }
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "뉴스 서버에 연결하지 못했어요.");
        }

        const articles = Array.isArray(data.articles)
          ? data.articles
          : Array.isArray(data)
            ? data
            : [];

        allArticles = articles
          .map(normalise)
          .filter(article => article.title && article.url);

        if (!allArticles.length) {
          elements.newsStatus.textContent =
            data.error || "가져온 뉴스가 없어요. 잠시 후 다시 시도해 주세요.";
          elements.newsStatus.classList.add("error");
          elements.updateText.textContent = "뉴스를 불러오지 못했어요.";
          return;
        }

        elements.updateText.textContent =
          allArticles.length + "개의 뉴스 · 마지막 확인 " +
          (data.updatedAt ? formatDate(data.updatedAt) : "방금");

        renderNews();
      } catch (error) {
        console.error("뉴스 불러오기 오류:", error);
        elements.newsStatus.textContent =
          "뉴스를 불러오지 못했어요. 연결과 배포 상태를 확인해 주세요. (" +
          (error.message || "연결 오류") + ")";
        elements.newsStatus.classList.add("error");
        elements.updateText.textContent = "뉴스 연결에 문제가 있어요.";
      } finally {
        elements.refreshButton.disabled = false;
        elements.refreshButton.textContent = "↻ 새로고침";
      }
    }

    async function showArticle(article) {
      currentArticle = article;
      const requestId = ++summaryRequestId;

      elements.homeView.hidden = true;
      elements.detailView.hidden = false;

      elements.detailCategory.textContent = article.category;
      elements.detailSource.textContent = article.domain;
      elements.detailDate.textContent = formatDate(article.date);
      elements.detailTitle.innerHTML = highlightTitle(article.title);

      elements.detailDescription.textContent = article.description;
      elements.detailDescription.hidden = !article.description;

      elements.detailImage.hidden = true;
      elements.detailImage.removeAttribute("src");
      elements.detailImage.alt = article.title;

      elements.easyArticle.replaceChildren();
      elements.termsList.replaceChildren();
      elements.termsSection.hidden = true;

      elements.originalLink.href = article.url || "#";

      elements.summaryStatus.hidden = false;
      elements.summaryStatus.classList.remove("error");
      elements.summaryStatus.textContent =
        "기사를 쉬운 말로 설명하고 있어요. 잠시만 기다려 주세요.";

      history.pushState(
        { view: "article", url: article.url },
        "",
        "#article"
      );

      window.scrollTo({ top: 0, behavior: "smooth" });

      findArticleImage(article).then(imageUrl => {
        if (requestId !== summaryRequestId || !imageUrl) return;

        elements.detailImage.onload = () => {
          elements.detailImage.hidden = false;
        };

        elements.detailImage.onerror = () => {
          elements.detailImage.hidden = true;
        };

        elements.detailImage.src = imageUrl;
      });

      try {
        const response = await fetch(API_SUMMARIZE, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            title: article.originalTitle || article.title,
            originalTitle: article.originalTitle || article.title,
            description: article.description || ""
          })
        });

        const data = await response.json();

        if (requestId !== summaryRequestId) return;
        if (!response.ok) {
          throw new Error(data.error || "AI 설명을 만들지 못했어요.");
        }

        const explanation = cleanText(
          data.article || data.summary || data.explanation || ""
        );

        if (!explanation) {
          throw new Error("AI가 설명을 반환하지 않았어요.");
        }

        elements.summaryStatus.hidden = true;

        explanation.split(/\n+/).forEach(line => {
          const text = line.trim();
          if (!text) return;

          const paragraph = document.createElement("p");
          paragraph.textContent = text;
          elements.easyArticle.appendChild(paragraph);
        });

        if (!elements.easyArticle.childElementCount) {
          const paragraph = document.createElement("p");
          paragraph.textContent = explanation;
          elements.easyArticle.appendChild(paragraph);
        }

        const terms = Array.isArray(data.terms) ? data.terms : [];

        terms.slice(0, 5).forEach(item => {
          if (!item || !item.term || !item.definition) return;

          const row = document.createElement("div");
          row.className = "term-item";

          const term = document.createElement("strong");
          term.textContent = item.term;

          const definition = document.createElement("span");
          definition.textContent = item.definition;

          row.append(term, definition);
          elements.termsList.appendChild(row);
        });

        elements.termsSection.hidden =
          !elements.termsList.childElementCount;
      } catch (error) {
        if (requestId !== summaryRequestId) return;

        console.error("AI 쉬운 설명 오류:", error);
        elements.summaryStatus.hidden = false;
        elements.summaryStatus.classList.add("error");
        elements.summaryStatus.textContent =
          "쉬운 설명을 불러오지 못했어요. (" +
          (error.message || "AI 요청 오류") + ")";
      }
    }

    function showHome() {
      summaryRequestId++;
      currentArticle = null;

      elements.detailView.hidden = true;
      elements.homeView.hidden = false;

      if (location.hash !== "#home") {
        history.pushState({ view: "home" }, "", "#home");
      }

      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    elements.categoryList.addEventListener("click", event => {
      const button = event.target.closest("[data-category]");
      if (!button) return;

      selectedCategory = button.dataset.category;

      elements.categoryList.querySelectorAll(".category-button")
        .forEach(item => {
          item.classList.toggle("active", item === button);
        });

      renderNews();
    });

    elements.refreshButton.addEventListener("click", loadNews);
    elements.homeBrand.addEventListener("click", showHome);
    elements.backButton.addEventListener("click", showHome);
    elements.backButtonBottom.addEventListener("click", showHome);

    window.addEventListener("popstate", () => {
      if (history.state?.view === "article" && currentArticle) {
        showArticle(currentArticle);
      } else {
        elements.detailView.hidden = true;
        elements.homeView.hidden = false;
        summaryRequestId++;
      }
    });

    elements.heroImage.addEventListener("error", () => {
      const fallback = document.createElement("div");
      fallback.className = "hero-image-fallback";
      fallback.textContent = "🥭";
      elements.heroImage.replaceWith(fallback);
    });

    loadNews();
  </script>
</body>
</html>
